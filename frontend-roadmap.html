        {
          theory: "A news feed frontend needs four main systems working together: data fetching with cursor-based pagination (so new posts don't shift items around), virtualisation to only render visible posts (never put 1000+ items in the DOM), real-time updates via WebSocket for the 'new posts available' badge, and image optimisation with lazy loading and placeholders. React Query or SWR handles the server state caching and background refetch. The feed should feel instant on return visits via aggressive caching.",
          example: "Facebook's News Feed: when you scroll down, new posts load automatically (cursor pagination). You never see 5000 posts in the DOM at once — only the ones on screen (virtualisation). A badge says '12 new posts' without reloading the page (WebSocket). Images fade in from blurry to sharp (placeholder + lazy load).",
          code: "// React Query for server state + cursor pagination\nconst { data, fetchNextPage } = useInfiniteQuery({\n  queryKey: ['feed'],\n  queryFn: ({ pageParam = null }) => fetchFeed({ cursor: pageParam }),\n  getNextPageParam: (lastPage) => lastPage.nextCursor\n});\n\n// IntersectionObserver triggers next page load\nconst loader = useRef(null);\nuseEffect(() => {\n  const obs = new IntersectionObserver(([entry]) => {\n    if (entry.isIntersecting) fetchNextPage();\n  }, { rootMargin: '200px' }); // pre-load 200px before bottom\n  obs.observe(loader.current);\n  return () => obs.disconnect();\n}, []);\n\n// WebSocket for real-time badge\nuseEffect(() => {\n  const ws = new WebSocket('wss://api.example.com/feed-updates');\n  ws.onmessage = (e) => setNewPostCount(c => c + JSON.parse(e.data).count);\n  return () => ws.close();\n}, []);"
        },
        {
          theory: "An autocomplete box needs: debouncing so you don't fire an API request on every keystroke; an LRU cache so repeated prefix queries are instant (no network); correct ARIA attributes so screen readers announce suggestions; and keyboard navigation with ArrowUp/Down to navigate suggestions, Enter to select, Escape to close. The UX should feel native — fast, accessible, and predictable.",
          example: "Google's search box: you type 're' and immediately see suggestions. If you type 'react' and come back to 're', the suggestions appear instantly (cached). You can navigate the list with arrow keys and pick with Enter. A screen reader announces 'react, option 1 of 5' as you navigate. All of these are deliberate engineering decisions.",
          code: "function Autocomplete({ onSelect }) {\n  const [value, setValue] = useState('');\n  const [results, setResults] = useState([]);\n  const [activeIdx, setActiveIdx] = useState(-1);\n  const cache = useRef(new Map());\n  const debouncedValue = useDebounce(value, 200);\n\n  useEffect(() => {\n    if (!debouncedValue) return setResults([]);\n    if (cache.current.has(debouncedValue)) {\n      return setResults(cache.current.get(debouncedValue));\n    }\n    fetchSuggestions(debouncedValue).then(data => {\n      cache.current.set(debouncedValue, data);\n      setResults(data);\n    });\n  }, [debouncedValue]);\n\n  const handleKeyDown = (e) => {\n    if (e.key === 'ArrowDown') setActiveIdx(i => Math.min(i+1, results.length-1));\n    if (e.key === 'ArrowUp')   setActiveIdx(i => Math.max(i-1, -1));\n    if (e.key === 'Enter' && activeIdx >= 0) onSelect(results[activeIdx]);\n    if (e.key === 'Escape') setResults([]);\n  };\n\n  return (\n    <div role=\"combobox\" aria-expanded={results.length > 0} aria-haspopup=\"listbox\">\n      <input value={value} onChange={e => setValue(e.target.value)}\n             onKeyDown={handleKeyDown} aria-autocomplete=\"list\"\n             aria-controls=\"suggestions\" aria-activedescendant={activeIdx >= 0 ? `opt-${activeIdx}` : undefined} />\n      <ul role=\"listbox\" id=\"suggestions\">\n        {results.map((r, i) => (\n          <li key={r.id} role=\"option\" id={`opt-${i}`}\n              aria-selected={i === activeIdx}\n              onClick={() => onSelect(r)}>{r.label}</li>\n        ))}\n      </ul>\n    </div>\n  );\n}"
        },
        {
          theory: "Real-time collaborative editing is one of the hardest distributed systems problems. Two users type at the same position simultaneously — whose change wins? You can't just 'last write wins' because that loses data. The two standard approaches are Operational Transformation (OT) — used by Google Docs — which transforms operations to account for concurrent changes, and CRDTs (Conflict-free Replicated Data Types) — used by Figma — which are data structures that always merge correctly by design. For the frontend, each change is sent as an operation (insert 'a' at position 5), not as the full document state.",
          example: "Two users both type at position 5 at the same time. User A inserts 'X' at position 5. User B inserts 'Y' at position 5. With OT: the server transforms B's operation to 'insert Y at position 6' (accounting for A's insert already happening). Both end up in the document in the correct relative order.",
          code: "// Operation format: describe the change, not the full state\n{ type: 'insert', position: 5, char: 'X', userId: 'A', version: 42 }\n{ type: 'delete', position: 3, userId: 'B', version: 43 }\n\n// Client: apply immediately (optimistic) + send to server\nfunction applyOp(doc, op) {\n  if (op.type === 'insert') {\n    return doc.slice(0, op.position) + op.char + doc.slice(op.position);\n  }\n  return doc.slice(0, op.position) + doc.slice(op.position + 1);\n}\n\n// Show peer cursors\nwebSocket.on('cursor', ({ userId, position }) => {\n  renderCursor(userId, position); // show coloured cursor for each peer\n});\n\n// Libraries that handle this complexity:\n// Yjs (CRDT — works offline, syncs on reconnect)\n// Automerge (CRDT)\n// ShareDB (OT)"
        },
        {
          theory: "A design system is the shared visual language and component library used across all products. The engineering challenges are: API stability (how do you update a component without breaking 50 teams?), accessibility (every component must be accessible out of the box), versioning (use semantic versioning so teams can upgrade safely), and documentation (Storybook makes components discoverable and self-documenting). The key insight is to treat the design system as a product — it has consumers, breaking changes, and a roadmap.",
          example: "Google's Material Design or Apple's HIG are public examples. Internally, most FAANG teams have their own. Airbnb's 'Lassen' component library serves dozens of products. The rule is: change a token (color variable), everything updates. Change a component's API, publish a major version with a migration guide.",
          code: "// Design tokens — the foundation (CSS custom properties)\n:root {\n  --color-primary: #534AB7;\n  --space-4: 16px;\n  --radius-md: 8px;\n  --text-sm: 13px;\n}\n\n// Component with token-based styling + accessible defaults\nfunction Button({ variant = 'primary', disabled, children, ...props }) {\n  return (\n    <button\n      className={`btn btn--${variant}`}\n      disabled={disabled}\n      aria-disabled={disabled} // for non-native button elements\n      {...props}\n    >\n      {children}\n    </button>\n  );\n}\n\n// Versioning strategy:\n// v1.2.3 → patch: bug fix, no API change\n// v1.3.0 → minor: new prop added (backward compatible)\n// v2.0.0 → major: prop renamed/removed + migration codemod\n\n// Storybook story for documentation\nexport const Primary = () => <Button variant=\"primary\">Click me</Button>;\nexport const Disabled = () => <Button disabled>Disabled</Button>;"
        },

          theory: "A real-time chat UI needs: WebSocket for the connection (persists unlike HTTP), optimistic updates so sent messages appear immediately before server confirmation, logical timestamps or sequence numbers for ordering (never use client Date.now() — clocks differ between devices), presence/heartbeat to show online status, and IndexedDB for offline message queuing so messages sent while offline are delivered when the connection returns.",
          example: "WhatsApp's message flow: you tap send → message appears instantly with a clock icon (optimistic). Server confirms → single tick appears. Recipient sees it → double tick. Recipient opens it → blue double tick. Each status change is a WebSocket event updating the message state.",
          code: "// Optimistic send with status tracking\nfunction sendMessage(text) {\n  const localId = crypto.randomUUID();\n  // Show immediately with 'sending' status\n  addMessage({ id: localId, text, status: 'sending' });\n\n  socket.emit('message', { localId, text });\n}\n\nsocket.on('message:confirmed', ({ localId, serverId }) => {\n  updateMessage(localId, { id: serverId, status: 'sent' });\n});\n\nsocket.on('message:read', ({ id }) => {\n  updateMessage(id, { status: 'read' });\n});\n\n// Heartbeat for presence\nsetInterval(() => socket.emit('heartbeat'), 30_000);\nsocket.on('presence', ({ userId, online }) => {\n  updatePresence(userId, online);\n});\n\n// Offline queue: store in IndexedDB, flush on reconnect\nsocket.on('disconnect', () => {\n  pendingMessages.forEach(msg => idb.put('queue', msg));\n});\nsocket.on('connect', () => {\n  idb.getAll('queue').then(msgs => {\n    msgs.forEach(msg => socket.emit('message', msg));\n    idb.clear('queue');\n  });\n});"
        }

        {
          theory: "Merge creates a merge commit that preserves the full history of both branches — you can see exactly when branches diverged and reunited. Rebase rewrites your commits onto the tip of another branch, making it look like you always worked from the latest state — cleaner linear history but changes commit SHA hashes. The danger: if you rebase a branch that other developers have already cloned and pulled, their local history diverges from yours. They get confusing conflicts. Rule: never rebase shared branches (main, develop). Only rebase your own local feature branch before opening a PR.",
          example: "Merge is like keeping the original draft of your essay with all your edit marks and sticky notes — the full messy history. Rebase is like rewriting the essay cleanly as if you always had the final version in mind. The clean version looks better but if someone else copied your messy draft, they now have a version that doesn't match yours.",
          code: "# SAFE: rebase your own feature branch before PR (linear history)\ngit checkout feature/my-feature\ngit rebase main  # replays your commits on top of latest main\n# Then open PR — clean linear history\n\n# NEVER rebase shared branches:\n# git checkout main\n# git rebase develop  ← DANGEROUS if others have pulled main\n\n# Interactive rebase — squash/reorder/edit commits\ngit rebase -i HEAD~3  # edit last 3 commits\n# In editor: change 'pick' to 'squash' to combine commits\n\n# Find which commit introduced a bug (binary search)\ngit bisect start\ngit bisect bad HEAD           # current commit is bad\ngit bisect good v1.2.0        # this version was good\n# Git checks out middle commit — test it, then:\ngit bisect good  # or  git bisect bad\n# Repeat until git identifies the exact commit"

        {
          theory: "GitHub Actions workflows are YAML files that define triggers (on: push, pull_request) and jobs that run in parallel or sequence. Jobs run on virtual machines (ubuntu-latest). Each job has steps — either run commands or use pre-built actions (actions/checkout, actions/cache). The critical optimisation is caching node_modules by the hash of package-lock.json — if lockfile hasn't changed, skip npm install entirely (70% faster CI).",
          example: "Every time you push to main, GitHub spins up a Linux server, clones your repo, runs your tests, builds your app, and deploys to S3 — all automated. If any step fails, the deployment doesn't happen. You get an email. The team sees a red X on the PR.",
          code: "# .github/workflows/deploy.yml\nname: CI/CD\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  lint-and-test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Cache node_modules\n        uses: actions/cache@v3\n        with:\n          path: node_modules\n          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}\n\n      - run: npm ci\n      - run: npm run lint   # fail fast — cheap check first\n      - run: npm test -- --coverage\n\n  deploy:\n    needs: lint-and-test  # only runs if lint-and-test passes\n    if: github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm run build\n      - uses: aws-actions/configure-aws-credentials@v2\n        with:\n          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}\n          aws-secret-access-key: ${{ secrets.AWS_SECRET }}\n          aws-region: us-east-1\n      - run: aws s3 sync ./dist s3://my-bucket --delete"
        },
        {
          theory: "TypeScript conditional types check if a type 'extends' another type and produce different types based on the result. Mapped types iterate over every key in an object type and transform each one. The infer keyword extracts a type from within another type (like 'pull out the return type from a function type'). Combining these three lets you build powerful utility types that transform existing types — the foundation of TypeScript's built-in utilities like Partial, ReturnType, and Parameters.",
          example: "Think of conditional types as a ternary operator for types: 'If T is an array, give me the element type; otherwise give me T'. Mapped types are like Array.map but for object keys: 'Take every property and make it optional'. infer is like pattern matching: 'Whatever the return type of this function is, call it R and give it to me'.",
          code: "// Conditional type: IsArray\ntype IsArray<T> = T extends any[] ? true : false;\ntype A = IsArray<string[]>;  // true\ntype B = IsArray<string>;    // false\n\n// infer: extract the return type of any function\ntype ReturnType<T> = T extends (...args: any[]) => infer R ? R : never;\ntype R = ReturnType<() => string>;  // string\n\n// DeepReadonly: recursively make every property readonly\ntype DeepReadonly<T> =\n  T extends (infer U)[]\n    ? ReadonlyArray<DeepReadonly<U>>\n    : T extends object\n      ? { readonly [K in keyof T]: DeepReadonly<T[K]> }\n      : T;\n\ntype Config = { server: { port: number; host: string }; debug: boolean };\ntype FrozenConfig = DeepReadonly<Config>;\n// { readonly server: { readonly port: number; readonly host: string }; readonly debug: boolean }"
        },
        {
          theory: "Migrating to i18n is a multi-phase project. First, you need to extract every hardcoded string from your codebase into translation files — tools like i18next-parser can scan your code automatically. Then set up the translation workflow (Lokalise or Crowdin) so translators can work without touching code. Then handle the edge cases: plurals, date/number formatting with the Intl API, and RTL languages like Arabic and Hebrew which require mirroring the entire layout. Replace all directional CSS properties (margin-left → margin-inline-start) which flip automatically in RTL.",
          example: "Microsoft ships products in 100+ languages. When you change the language to Arabic in Windows, the whole interface mirrors right-to-left — menu items, text, scrollbars. This works because they used logical CSS properties (inline-start instead of left) and proper i18n from the start.",
          code: "// Phase 1: Extract hardcoded strings with react-i18next\n// Before:\n<h1>Welcome back, {user.name}</h1>\n<p>You have {count} notifications</p>\n\n// After:\nimport { useTranslation, Trans } from 'react-i18next';\nconst { t } = useTranslation();\n<h1>{t('welcome', { name: user.name })}</h1>\n<p>{t('notifications', { count, defaultValue_plural: '{{count}} notifications' })}</p>\n\n// en.json:\n// { \"welcome\": \"Welcome back, {{name}}\",\n//   \"notifications_one\": \"You have 1 notification\",\n//   \"notifications_other\": \"You have {{count}} notifications\" }\n\n// Phase 2: Intl API for numbers and dates\nconst fmt = new Intl.NumberFormat(locale, { style:'currency', currency:'USD' });\nfmt.format(1234.5); // 'en-US' → '$1,234.50', 'de-DE' → '1.234,50 $'\n\n// Phase 3: RTL support — logical CSS properties\n.nav-item {\n  margin-inline-start: 16px;  /* = margin-left in LTR, margin-right in RTL */\n  padding-inline-end: 8px;   /* = padding-right in LTR, padding-left in RTL */\n}\n// HTML: <html dir=\"rtl\"> or <html lang=\"ar\"> + CSS logical props"
        },
        {
          theory: "A Dockerfile for Next.js production should use a multi-stage build. Stage 1 installs dependencies. Stage 2 copies source and runs the build. Stage 3 starts fresh from a clean minimal image and copies only the production output — no source code, no devDependencies, no build tools. This produces a final image that's 5-10x smaller than a naive single-stage build. Next.js's 'output: standalone' config creates a self-contained server file you can copy directly.",
          example: "Without multi-stage builds, your Docker image contains your entire source code, all devDependencies (Babel, TypeScript compiler, Webpack), and the build output. That might be 1GB. A multi-stage build's final image contains only the runtime Node.js and the compiled output — maybe 100MB. Smaller = faster deploys and less attack surface.",
          code: "# Stage 1: Install dependencies\nFROM node:20-alpine AS deps\nWORKDIR /app\nCOPY package*.json ./\n# npm ci is reproducible and skips lifecycle scripts\nRUN npm ci --only=production\n\n# Stage 2: Build the app\nFROM node:20-alpine AS builder\nWORKDIR /app\nCOPY --from=deps /app/node_modules ./node_modules\nCOPY . .\nRUN npm run build\n\n# Stage 3: Minimal production image\nFROM node:20-alpine AS runner\nWORKDIR /app\nENV NODE_ENV=production\n\n# Copy ONLY what's needed to run the app\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\nCOPY --from=builder /app/public ./public\n\n# Don't run as root\nRUN addgroup -S app && adduser -S app -G app\nUSER app\n\nEXPOSE 3000\nCMD [\"node\", \"server.js\"]\n\n# next.config.js must have: output: 'standalone'"
        }
      ],
      p7: [
        {
          theory: "Promise.all takes an array of promises and returns a new promise that resolves with an array of all results (in order) when all input promises resolve, or rejects immediately if any promise rejects. From scratch: create a new Promise, keep a results array and a count, attach .then() to each input promise — when each resolves, store its result at the correct index and check if all are done. One rejection triggers the outer reject immediately.",
          example: "Imagine ordering three dishes at a restaurant — you want all of them delivered together. Promise.all waits for all three. If any dish fails (kitchen fire), the whole order is cancelled (reject). Each dish resolves independently — they can finish in any order, but you get them all in the order you ordered.",
          code: "function promiseAll(promises) {\n  return new Promise((resolve, reject) => {\n    if (!promises.length) return resolve([]);\n\n    const results = new Array(promises.length);\n    let resolved = 0;\n\n    promises.forEach((p, i) => {\n      // Wrap in Promise.resolve() in case p is a plain value\n      Promise.resolve(p).then(\n        (value) => {\n          results[i] = value;  // store in correct index\n          resolved++;\n          if (resolved === promises.length) resolve(results);\n        },\n        (err) => reject(err)  // first rejection wins\n      );\n    });\n  });\n}\n\n// Test it:\npromiseAll([\n  Promise.resolve(1),\n  Promise.resolve(2),\n  Promise.resolve(3)\n]).then(console.log); // [1, 2, 3]"
        },
        {
          theory: "Currying transforms a function that takes multiple arguments into a chain of functions that each take one argument. curry(add)(1)(2)(3) is equivalent to add(1, 2, 3). The key insight is: a curried function either has enough arguments to call the original function, or it returns another function collecting more arguments. You check this by comparing how many arguments have been accumulated so far (args.length) against how many the original function needs (fn.length, its declared parameter count).",
          example: "A coffee machine that takes beans, water, and milk. Currying lets you pre-configure: const espresso = makeCoffee('espresso beans'); then later const bigEspresso = espresso('500ml water')('no milk'). You can 'partially apply' arguments and reuse the partially-applied version.",
          code: "function curry(fn) {\n  return function curried(...args) {\n    if (args.length >= fn.length) {\n      // Have enough args — call the original function\n      return fn.apply(this, args);\n    }\n    // Not enough yet — return a function collecting more\n    return function(...moreArgs) {\n      return curried.apply(this, args.concat(moreArgs));\n    };\n  };\n}\n\n// Test with a 3-argument function\nconst add = (a, b, c) => a + b + c;\nconst curriedAdd = curry(add);\n\ncurriedAdd(1)(2)(3);    // 6\ncurriedAdd(1, 2)(3);    // 6\ncurriedAdd(1)(2, 3);    // 6\ncurriedAdd(1, 2, 3);    // 6 — also works with all args at once\n\n// Partial application:\nconst add10 = curriedAdd(10);\nadd10(5)(2); // 17"
        },
        {
          theory: "A normal deep clone (using JSON.parse/JSON.stringify) fails on circular references — objects that reference themselves — because JSON can't represent cycles. The fix is to use a WeakMap to track objects you've already cloned. Before recursing into an object, check if you've already cloned it — if yes, return the clone you made earlier. This breaks the cycle. WeakMap is used (not Map) so that if the original objects are garbage collected, the WeakMap entries are automatically removed too.",
          example: "A tree node that has a 'parent' reference pointing back to its parent, which has a 'children' array pointing to the node — that's a circular reference. Without tracking visited nodes, a naive clone would follow the cycle forever. With a WeakMap, the second time you encounter the parent, you return the already-cloned version.",
          code: "function deepClone(value, seen = new WeakMap()) {\n  // Primitives: return as-is\n  if (value === null || typeof value !== 'object') return value;\n\n  // Handle Date\n  if (value instanceof Date) return new Date(value);\n\n  // Handle circular reference: already cloned this object?\n  if (seen.has(value)) return seen.get(value);\n\n  // Create the clone structure\n  const clone = Array.isArray(value) ? [] : {};\n\n  // Register BEFORE recursing (in case object references itself)\n  seen.set(value, clone);\n\n  // Recursively clone each property\n  for (const key in value) {\n    if (Object.prototype.hasOwnProperty.call(value, key)) {\n      clone[key] = deepClone(value[key], seen);\n    }\n  }\n  return clone;\n}\n\n// Circular reference test:\nconst a = { name: 'node' };\na.self = a; // circular!\nconst b = deepClone(a);\nconsole.log(b.self === b); // true — cycle preserved correctly"
        },
        {
          theory: "Event delegation attaches one listener on a parent element instead of many listeners on individual children. When any child is clicked, the click bubbles up to the parent and the handler runs. You use element.closest(selector) to check if the actual click target (or any of its ancestors up to the parent) matches your selector. The big advantage: it works for dynamically added elements — children added after the listener is attached are automatically covered.",
          example: "Instead of attaching click listeners to every row in a 1000-row table, attach one listener to the table. When a row is clicked, the event bubbles to the table. You check 'was the click on a delete button?' and handle it. Add new rows dynamically — they're automatically handled. 1 listener vs 1000.",
          code: "function addDelegatedListener(parent, selector, event, handler) {\n  parent.addEventListener(event, function(e) {\n    // closest() walks up from click target to find matching ancestor\n    const target = e.target.closest(selector);\n\n    // Make sure matched element is actually inside our parent\n    if (target && parent.contains(target)) {\n      handler.call(target, e);\n    }\n  });\n}\n\n// Usage:\nconst list = document.getElementById('list');\naddDelegatedListener(list, '.delete-btn', 'click', function(e) {\n  this.closest('li').remove(); // 'this' = the .delete-btn that was clicked\n});\n\n// Now dynamically added items are handled automatically:\nlist.insertAdjacentHTML('beforeend',\n  '<li>New item <button class=\"delete-btn\">×</button></li>'\n);\n// Clicking the new × button works — no new listener needed!"
        },
        {
          theory: "The STAR method is the standard framework for answering behavioural questions: Situation (set the scene — team size, tech stack, constraints), Task (what you were specifically responsible for), Action (what you actually did — be specific about your decisions and why), Result (measurable outcome — numbers, percentages, user impact). The key is to quantify results and show your individual contribution, not your team's. Prepare 8-10 stories that can flex to different question angles ('Tell me about a challenge', 'Tell me about a failure', 'Tell me about a conflict').",
          example: "Weak: 'We improved the checkout page performance.' Strong: 'Our team's checkout page had a 4.8s LCP. I ran a Lighthouse audit, identified an unpreloaded hero image and 200KB of render-blocking CSS, implemented fixes over 3 days, and reduced LCP to 1.9s — checkout conversion rate increased 8% in the next two weeks.'",
          code: "// STAR framework template\n\n// SITUATION — 1-2 sentences, gives context\n\"At [Company], our checkout page had a 4.8s LCP and\n a 6% cart abandonment rate above industry average.\"\n\n// TASK — your specific role\n\"As the performance lead on a 3-person frontend team,\n I was responsible for identifying and fixing the bottleneck.\"\n\n// ACTION — specific, detailed decisions (this is the meat)\n\"I ran a Lighthouse audit → identified unoptimised hero image.\n Implemented: fetchpriority='high', preload link, WebP format,\n inlined critical CSS. Also split 80KB analytics bundle out of\n critical path using dynamic import.\"\n\n// RESULT — numbers!\n\"LCP dropped from 4.8s to 1.9s (under the 2.5s Good threshold).\n Cart abandonment fell by 2.3 percentage points.\n Estimated $1.2M annual revenue increase based on conversion data.\"\n\n// Key: the interviewer doesn't just want what happened —\n// they want to understand YOUR thinking and decision-making."
        },
        {
          theory: "1,000 tickers updating every second is 1,000 DOM updates per second — that will completely freeze any browser if done naively. The solution requires three things working together: virtual scrolling (only render 20-30 visible rows in the DOM, not 1000), batch WebSocket updates (collect all messages from the last frame and apply them in one requestAnimationFrame callback), and compositor-only animations for price flashes (using CSS transform or opacity, which don't trigger layout or paint).",
          example: "Think of an airport departures board with 1000 flights updating simultaneously. If it had to repaint every pixel of every row every second, the board would flicker constantly. Real boards only update the changed cells and use hardware-accelerated LED panels — that's the equivalent of virtual scrolling + GPU compositing.",
          code: "// Batch WebSocket updates with requestAnimationFrame\nconst pendingUpdates = new Map();\nlet frameScheduled = false;\n\nwebSocket.onmessage = (e) => {\n  const { tickerId, price, change } = JSON.parse(e.data);\n  pendingUpdates.set(tickerId, { price, change }); // latest wins\n\n  if (!frameScheduled) {\n    frameScheduled = true;\n    requestAnimationFrame(() => {\n      // Apply ALL updates in one frame — one React render\n      setTickers(prev => {\n        const next = { ...prev };\n        pendingUpdates.forEach((data, id) => { next[id] = data; });\n        pendingUpdates.clear();\n        return next;\n      });\n      frameScheduled = false;\n    });\n  }\n};\n\n// Price flash animation — CSS only, compositor-layer\n// .up  { animation: flashGreen 0.5s ease; }\n// .down { animation: flashRed  0.5s ease; }\n// @keyframes flashGreen { 0%{background:#22c55e} 100%{background:inherit} }\n// These use opacity/background-color on a separate layer\n// — no reflow, no repaint of other elements"

    const STORAGE_KEY = "frontend_roadmap_v2";
    const TODAY_KEY = "frontend_roadmap_today";

    function loadState() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
    function loadTodayData() { try { const r = localStorage.getItem(TODAY_KEY); if (!r) return { date: today(), count: 0 }; const d = JSON.parse(r); return d.date === today() ? d : { date: today(), count: 0 }; } catch (e) { return { date: today(), count: 0 }; } }
    function today() { return new Date().toISOString().split("T")[0]; }

    let state = loadState();
    let todayData = loadTodayData();
    let currentSidebarId = null;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(TODAY_KEY, JSON.stringify(todayData)); }

    function toggle(id, e) {
      if (e) e.stopPropagation();
      const current = state[id];
      if (!current) {
        state[id] = 'ip';
      } else if (current === 'ip') {
        state[id] = true;
        todayData.count++;
        todayData.date = today();
      } else {
        state[id] = null;
        if (todayData.count > 0) todayData.count--;
      }
      save(); renderAll();
      if (currentSidebarId === id) updateSidebarDoneBtn(id);
    }

    function toggleFromSidebar() { if (currentSidebarId) toggle(currentSidebarId); }

    function resetAll() { if (!confirm("Reset all progress? This cannot be undone.")) return; state = {}; todayData = { date: today(), count: 0 }; save(); renderAll(); }

    // ── Sidebar ──
    function esc(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function openSidebar(topicId, phaseColor, phaseBg, phaseTitle) {
      const info = TOPIC_INFO[topicId];
      if (!info) return;
      currentSidebarId = topicId;

      // Find topic name
      let topicName = topicId, isFaang = false;
      for (const p of ROADMAP) for (const s of p.sections) for (const t of s.topics) if (t.id === topicId) { topicName = t.name; isFaang = !!t.faang; break; }

      document.getElementById("sb-icon").style.background = phaseBg;
      document.getElementById("sb-icon").style.color = phaseColor;
      document.getElementById("sb-icon").innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
      document.getElementById("sb-title").textContent = topicName;
      document.getElementById("sb-phase").textContent = phaseTitle;

      const body = document.getElementById("sb-body");
      body.innerHTML = `
    ${isFaang ? `<div class="sidebar-faang-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> High-priority FAANG topic</div>` : ''}
    <div class="info-block">
      <div class="info-block-label"><span style="background:#E6F1FB; color:#185FA5">?</span> What it is</div>
      <div class="info-block-text">${esc(info.what)}</div>
    </div>
    <div class="info-block">
      <div class="info-block-label"><span style="background:#FAEEDA; color:#854F0B">★</span> Why it matters</div>
      <div class="info-block-text">${esc(info.why)}</div>
    </div>
    <div class="info-block">
      <div class="info-block-label"><span style="background:#E1F5EE; color:#0F6E56">→</span> Key points</div>
      <div class="key-points">${info.points.map(p => `<div class="key-point"><div class="key-point-dot"></div><span>${esc(p)}</span></div>`).join('')}</div>
    </div>
  `;

      updateSidebarDoneBtn(topicId);
      document.getElementById("overlay").classList.add("open");
      document.getElementById("sidebar").classList.add("open");
    }

    function updateSidebarDoneBtn(id) {
      const btn = document.getElementById("sb-done-btn");
      if (state[id] === true) {
        btn.textContent = "✓ Marked complete — click to undo";
        btn.classList.add("already-done");
      } else if (state[id] === 'ip') {
        btn.textContent = "⟳ In progress — click to mark complete";
        btn.classList.remove("already-done");
      } else {
        btn.textContent = "Mark as complete";
        btn.classList.remove("already-done");
      }
    }

    function closeSidebar() {
      document.getElementById("overlay").classList.remove("open");
      document.getElementById("sidebar").classList.remove("open");
      currentSidebarId = null;
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeSidebar();
        closeQAModal();
      }
    });

    // ── Q&A Modal ──
    function openQAModal(phaseId, e) {
      if (e) e.stopPropagation();
      const phase = ROADMAP.find(p => p.id === phaseId);
      const qs = PHASE_QUESTIONS[phaseId] || [];
      const qas = PHASE_QA[phaseId] || [];

      document.getElementById("qa-modal-icon").style.background = phase.bg;
      document.getElementById("qa-modal-icon").style.color = phase.color;
      document.getElementById("qa-modal-icon").innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
      document.getElementById("qa-modal-ttl").textContent = phase.title + " — Interview Q&A";
      document.getElementById("qa-modal-sub").textContent = qs.length + " questions with full answers";

      const body = document.getElementById("qa-modal-body");
      body.innerHTML = qs.map((q, i) => {
        const qa = qas[i] || {};
        return `
      <div class="qa-item-full">
        <div class="qa-item-q">
          <span class="qa-item-qn">${i + 1}.</span>
          <span class="qa-item-qt">${esc(q.q)}</span>
          <div class="qa-item-badges">
            <span class="q-diff ${q.diff}" style="font-size:10px;">${q.diff === 'hard' ? 'Hard' : 'Med'}</span>
            <span style="font-size:9px; color:var(--text3); padding:2px 5px; border:0.5px solid var(--border); border-radius:3px;">${esc(q.co)}</span>
          </div>
        </div>
        <div class="qa-item-ans">
          ${qa.theory ? `
          <div class="qa-ans-section">
            <div class="qa-ans-lbl"><span class="qa-ans-lbl-dot" style="background:#534AB7"></span> What's the answer?</div>
            <div class="qa-ans-txt">${esc(qa.theory)}</div>
          </div>` : ''}
          ${qa.example ? `
          <div class="qa-ans-section">
            <div class="qa-ans-lbl"><span class="qa-ans-lbl-dot" style="background:#1D9E75"></span> Real-world example</div>
            <div class="qa-ans-txt">${esc(qa.example)}</div>
          </div>` : ''}
          ${qa.code ? `
          <div class="qa-ans-section">
            <div class="qa-ans-lbl"><span class="qa-ans-lbl-dot" style="background:#EF9F27"></span> Code</div>
            <pre class="qa-ans-code">${esc(qa.code)}</pre>
          </div>` : ''}
        </div>
      </div>
    `;
      }).join('');

      document.getElementById("qa-overlay").classList.add("open");
    }

    function closeQAModal() {
      document.getElementById("qa-overlay").classList.remove("open");
    }

    function handleQAOverlayClick(e) {
      if (e.target === document.getElementById("qa-overlay")) closeQAModal();
    }

    // ── Stats ──
    function renderAll() {
      let totalTopics = 0, doneCnt = 0, phasesDone = 0;
      ROADMAP.forEach(phase => {
        let pTotal = 0, pDone = 0;
        phase.sections.forEach(s => s.topics.forEach(t => { pTotal++; totalTopics++; if (state[t.id] === true) { pDone++; doneCnt++; } }));
        const pct = pTotal ? Math.round(pDone / pTotal * 100) : 0;
        const circumference = 2 * Math.PI * 14;
        const ring = document.getElementById("ring-" + phase.id);
        const fill = document.getElementById("fill-" + phase.id);
        const txt = document.getElementById("ringtxt-" + phase.id);
        if (ring) ring.style.strokeDashoffset = circumference * (1 - pct / 100);
        if (fill) fill.style.width = pct + "%";
        if (txt) txt.textContent = pct + "%";
        if (pDone === pTotal && pTotal > 0) phasesDone++;
        phase.sections.forEach(s => s.topics.forEach(t => {
          const el = document.getElementById("topic-" + t.id);
          if (el) {
            el.classList.toggle("done", state[t.id] === true);
            el.classList.toggle("in-progress", state[t.id] === 'ip');
          }
        }));
      });
      const pct = totalTopics ? Math.round(doneCnt / totalTopics * 100) : 0;
      document.getElementById("overall-bar").style.width = pct + "%";
      document.getElementById("overall-pct").textContent = pct + "%";
      document.getElementById("overall-label").textContent = doneCnt + " of " + totalTopics + " topics complete";
      document.getElementById("s-done").textContent = doneCnt;
      document.getElementById("s-left").textContent = totalTopics - doneCnt;
      document.getElementById("s-phases").textContent = phasesDone;
      const currentStreak = todayData.date === today() ? todayData.count : 0;
      const streakText = currentStreak > 0 ? currentStreak + " day streak — keep going" : "0 day streak — start today";
      document.getElementById("s-streak").textContent = streakText;

      // Update today's focus text
      let focusText = "Phase 1 — Foundations. Continue where you left off below.";
      if (pct > 0 && pct < 100) {
        focusText = "Great progress! You are currently at " + pct + "% completion. Keep it up!";
      } else if (pct === 100) {
        focusText = "Incredible! You have completed the entire roadmap. You are ready for FAANG!";
      }
      const focusEl = document.getElementById("today-focus");
      if (focusEl) focusEl.textContent = focusText;
    }

    // ── Build DOM ──
    function buildPhaseCard(phase) {
      const circ = 2 * Math.PI * 14;
      const card = document.createElement("div");
      card.className = "phase-card";
      card.id = "card-" + phase.id;
      card.innerHTML = `
    <div class="phase-header" onclick="togglePhase('${phase.id}')">
      <div class="phase-icon" style="background:${phase.bg}; color:${phase.color}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"></polyline>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
      </div>
      <div class="phase-info">
        <div class="phase-title">${phase.title}</div>
        <div class="phase-subtitle">${phase.subtitle}</div>
      </div>
      <div class="phase-right">
        <button class="qa-open-btn" onclick="openQAModal('${phase.id}', event)" title="View full Q&amp;A with answers">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Q&amp;A
        </button>
        <div class="phase-progress-ring">
          <svg width="40" height="40" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="14" fill="none" stroke="var(--surface2)" stroke-width="3.5"/>
            <circle id="ring-${phase.id}" cx="18" cy="18" r="14" fill="none" stroke="${phase.color}" stroke-width="3.5"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ}" stroke-linecap="round"
              style="transition:stroke-dashoffset 0.4s ease;"/>
          </svg>
          <div class="ring-text" id="ringtxt-${phase.id}">0%</div>
        </div>
        <div class="chevron">▾</div>
      </div>
    </div>
    <div class="phase-phase-bar"><div class="phase-phase-fill" id="fill-${phase.id}" style="background:${phase.color}; width:0%"></div></div>
    <div class="topics" id="topics-${phase.id}">
      <div class="tip-bar" id="tip-${phase.id}"></div>
      <div class="phase-body-grid">
      <div class="topics-col">
      ${phase.sections.map(s => `
        <div class="topic-section">
          <div class="topic-section-title">${s.name}</div>
          <div class="topic-grid">
            ${s.topics.map(t => `
              <div class="topic-item${state[t.id] === true ? ' done' : state[t.id] === 'ip' ? ' in-progress' : ''}" id="topic-${t.id}">
                <div class="topic-check" onclick="toggle('${t.id}', event)" title="Mark complete">
                  <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
                    <path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="topic-body" onclick="openSidebar('${t.id}', '${phase.color}', '${phase.bg}', '${phase.title}')">
                  <div class="topic-name">${t.name}</div>
                  <div class="topic-desc">${t.desc}</div>
                </div>
                <div class="topic-actions">
                  ${t.faang ? `<span class="faang-tag">FAANG ★</span>` : ''}
                  <button class="info-btn" onclick="openSidebar('${t.id}', '${phase.color}', '${phase.bg}', '${phase.title}')" title="Learn more">i</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
      </div>
      <div class="questions-col">${buildQuestionsHTML(phase.id)}</div>
      </div>
    </div>
    <div class="resources-row" id="res-${phase.id}" style="display:none;">
      ${phase.resources.map((r, i) => `<a class="resource-link" href="${phase.resourceUrls[i]}" target="_blank">↗ ${r}</a>`).join('')}
    </div>
  `;
      return card;
    }

    function togglePhase(id) {
      const card = document.getElementById("card-" + id);
      const topics = document.getElementById("topics-" + id);
      const res = document.getElementById("res-" + id);
      const isOpen = card.classList.contains("open");
      card.classList.toggle("open", !isOpen);
      topics.style.display = isOpen ? "none" : "block";
      res.style.display = isOpen ? "none" : "flex";
      if (!isOpen) {
        const phase = ROADMAP.find(p => p.id === id);
        const tot = phase.sections.reduce((a, s) => a + s.topics.length, 0);
        const done = phase.sections.reduce((a, s) => a + s.topics.filter(t => state[t.id] === true).length, 0);
        const inProg = phase.sections.reduce((a, s) => a + s.topics.filter(t => state[t.id] === 'ip').length, 0);
        const tipEl = document.getElementById("tip-" + id);
        tipEl.textContent = done === tot
          ? "✓ Phase complete! Great work — move to the next phase."
          : `${done} / ${tot} done${inProg ? ` · ${inProg} in progress` : ''} — click the checkbox once to mark in progress, twice for done, three times to reset.`;
      }
    }

    // Phase display order — each phase builds on the previous one
    const PHASE_ORDER = [
      'p8',  // 1. Browser Internals & Networking  — understand the environment first
      'p1',  // 2. Foundations                      — HTML/CSS/a11y inside that environment
      'p2',  // 3. JavaScript Core + DSA            — the language powering the browser
      'p9',  // 4. Advanced JS & Design Patterns    — deepen JS before picking a framework
      'p3',  // 5. React & Ecosystem                — framework built on top of deep JS
      'p4',  // 6. Node.js & Backend Basics         — full-stack context for API design
      'p5',  // 7. Performance & Optimisation       — optimise now that you know the full stack
      'p6',  // 8. System Design & Scalability      — architect at scale using all prior knowledge
      'p10', // 9. Tooling, i18n & Advanced TS      — professional practices & cross-cutting concerns
      'p7',  // 10. FAANG Interview Prep            — apply everything in interview format
    ];

    const root = document.getElementById("phases-root");
    PHASE_ORDER.map(id => ROADMAP.find(p => p.id === id)).forEach(phase => root.appendChild(buildPhaseCard(phase)));
    togglePhase("p8");
    renderAll();
  </script>
<script src="nav.js"></script>
</body>

</html>
