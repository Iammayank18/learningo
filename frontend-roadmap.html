      sd9: { what: "Designing a news feed (Facebook/Twitter-style): infinite scroll, ranking algorithm (recency + engagement), real-time new post notifications, media optimisation.", why: "News feed is one of the top 5 FAANG frontend system design questions. It tests data fetching, scroll virtualisation, real-time updates, and caching at scale.", points: ["Cursor-based pagination is more stable than offset for feeds (items inserted/deleted)", "Virtualize the feed list — never render 1000+ items at once", "New post badge: long-poll or WebSocket to notify user of new items", "Pre-fetch next page when user reaches 80% scroll depth"] },
      sd10: { what: "Autocomplete suggests completions as the user types. Backend uses a trie or prefix search. Frontend debounces input, caches results, handles keyboard navigation, and manages loading/error states.", why: "Autocomplete is asked at almost every FAANG UI system design round. It combines debouncing, caching, keyboard a11y, and backend interaction in one tight problem.", points: ["Debounce input: wait 150-300ms after typing stops before fetching", "Cache responses by query string — avoid refetching the same prefix", "Keyboard: ArrowDown/Up to navigate, Enter to select, Escape to close", "Highlight matching prefix in results with <mark> — screen-reader friendly"] },
      sd11: { what: "Designing a chat UI (WhatsApp/Messenger-style): real-time message delivery via WebSockets, message ordering and deduplication, read receipts, presence indicators, and optimistic updates.", why: "Real-time systems are complex and appear in FAANG senior design rounds. They test knowledge of WebSockets, offline handling, message ordering, and state synchronisation.", points: ["Optimistic updates: show message immediately, reconcile with server ID on confirm", "Message ordering: use logical timestamps or sequence numbers, not client time", "Presence: heartbeat every 30s — mark offline after 60s without response", "Offline support: queue messages in IndexedDB, send when reconnected"] },
      sd12: { what: "Designing an image CDN/upload system: client-side upload directly to object storage (S3), image transformations (resize, format, quality) on CDN edge, signed URLs for private images.", why: "Image handling at scale appears in FAANG design rounds for products like Instagram, Google Photos. It tests understanding of CDN, storage, transformations, and access control.", points: ["Direct upload to S3 with pre-signed URL bypasses your server — faster and no bandwidth cost", "Transform at edge: CDN URL parameters (w=800&f=webp) trigger edge image processing", "Use blurhash or low-quality image placeholder (LQIP) while full image loads", "Lazy load images with loading='lazy' or IntersectionObserver for off-screen images"] },
      // FAANG prep
      li1: { what: "The Blind 75 is a curated list of 75 LeetCode problems that cover all important algorithmic patterns tested at FAANG. Created by a Facebook engineer to cut through thousands of problems.", why: "FAANG coding interviews draw heavily from these patterns. Solving all 75 problems gives you coverage of the most frequent question types with manageable time investment.", points: ["Solve in order by topic: Arrays → Strings → Trees → DP → Graph", "For each problem: understand brute force, then optimise to optimal", "After solving, look at top-voted solutions to see alternative approaches", "Time yourself: target 20-25 min for medium, 35-40 min for hard"] },
      li2: { what: "Sliding window maintains a subset of elements within a range. Fixed window has constant size. Variable window expands/shrinks based on a condition.", why: "Sliding window converts O(n²) brute force substring/subarray problems to O(n). Appears in ~10% of FAANG array/string questions.", points: ["Template: left=0, right moves right, shrink left when condition breaks", "Longest substring without repeating chars: shrink when char already in window", "Minimum window substring: shrink once all required chars are in window", "Use a Map/Set to track window contents — O(1) lookup"] },
      li3: { what: "Backtracking explores all possible solutions by building candidates incrementally and abandoning a candidate ('backtracking') when it determines it cannot lead to a valid solution.", why: "Permutations, subsets, combinations, Sudoku, N-Queens — all use backtracking. They appear in FAANG hard rounds and test your ability to prune search spaces.", points: ["Template: for each choice → make choice → recurse → undo choice", "Pruning is critical — check constraints early to avoid exploring dead ends", "Subsets: at each element, choose to include or not include", "Permutations: at each position, try all unused elements"] },
      li4: { what: "Graph traversal with BFS (uses queue, finds shortest path) and DFS (uses stack/recursion, explores depth). Topological sort orders nodes so dependencies come before dependents.", why: "Graph problems (islands, shortest path, course schedule) appear frequently at FAANG. They test your ability to model problems as graphs and choose the right traversal.", points: ["Number of Islands: DFS/BFS from each unvisited land cell, mark visited", "Shortest path in unweighted graph: always BFS — guarantees shortest", "Topological sort: Kahn's algorithm (BFS with in-degree tracking) or DFS with post-order", "Detect cycle in directed graph: DFS with 3-state visited (unvisited, visiting, visited)"] },
      li5: { what: "Frontend-specific LeetCode: implement curry, memoize, debounce, throttle, EventEmitter, flatten nested arrays/objects, deep equal, Promise.all from scratch.", why: "FAANG frontend rounds often include 'implement this utility' questions testing JS fundamentals. These are different from typical algorithm questions.", points: ["curry: function returning function until all args received — check args.length vs fn.length", "memoize: closure over a Map, key = JSON.stringify(args)", "debounce: clearTimeout then setTimeout — fires after quiet period", "EventEmitter: Map of event → Set of listeners, emit() calls all"] },
      beh1: { what: "The STAR method (Situation, Task, Action, Result) structures behavioural answers. Build a bank of 8-10 stories that you can adapt to different questions.", why: "Behavioural interviews are 30-50% of the FAANG process at senior levels. Amazon uses Leadership Principles as a framework. Meta and Google have their own values. Prepared stories convert to offers.", points: ["Cover: biggest impact, a conflict, a failure/learning, influence without authority", "Quantify results: 'reduced latency by 40%', 'saved $2M/year', 'grew DAU by 15%'", "Prepare stories that work for multiple questions by changing the framing", "Practice out loud — fluency matters as much as content"] },
      beh2: { what: "Amazon has 16 Leadership Principles (Customer Obsession, Ownership, Invent and Simplify, etc.). Google values: curiosity, collaboration, leadership, problem solving. Meta: move fast, impact, focus on long-term.", why: "FAANG interviews explicitly evaluate culture fit against defined values. Knowing the principles lets you frame stories in language that resonates with the interviewer.", points: ["Amazon: every interview question maps to 1-2 LPs — identify which one", "'Tell me about a time you disagreed with your manager' → Disagree and Commit LP", "Google: Googleyness — being intellectually humble, collaborative, and passionate", "Meta: think about your biggest impact stories — Meta values demonstrable scale"] },
      beh3: { what: "Salary negotiation: researching market rates, anchoring with a number or range, handling exploding offers, negotiating beyond base (equity, signing bonus, title).", why: "Most engineers leave 10-30% compensation on the table by not negotiating. FAANG offers are highly structured — knowing the components and how to negotiate each is a financial superpower.", points: ["Never give a number first — 'I'm flexible and want what's fair for someone with my experience'", "Once you have an offer, use competing offers or target range to anchor higher", "Equity (RSUs) often exceeds base at FAANG — negotiate vest schedule and cliff", "Signing bonus compensates for unvested equity you're leaving behind"] },
      m1: { what: "Mock coding sessions with real interviewers on Pramp (free, peer matching), Interviewing.io (paid, with FAANG engineers), or peer partners. Simulate real interview conditions.", why: "Reading solutions and solving at leisure is very different from performing under interview pressure. Mock interviews build the communication habits (thinking out loud, time management) that make the difference.", points: ["Always think out loud — explain your approach before writing code", "Start with brute force, state the complexity, then optimise", "Time yourself strictly: 5 min understand, 10 min plan, 20 min code, 5 min test", "Ask clarifying questions up front — interviewers give hints this way"] },
      m2: { what: "Mock system design interviews: use draw.io or Excalidraw to sketch architecture, explain trade-offs out loud, receive feedback from a peer or paid coach.", why: "System design is a skill learned through practice and feedback. Without mock sessions, you won't know your gaps until the real interview — too late.", points: ["Practice the structure: requirements → estimation → API design → data model → components → deep dive", "Always discuss trade-offs — why this choice over the alternative?", "For frontend design: focus on component architecture, data fetching, and performance", "Record your session and watch it back — you'll spot gaps you missed in the moment"] },
      m3: { what: "Recording yourself answering questions and reviewing the recording to identify verbal tics, pace, clarity, and content gaps.", why: "Most people are unaware of their speaking habits until they hear themselves. Filler words (um, like, you know) and unclear explanations are invisible to the speaker but obvious to interviewers.", points: ["Use Loom for quick self-recordings — no setup required", "Count filler words per minute — target < 3", "Review: is the answer structured? Does it have a clear beginning, middle, end?", "Technical clarity: would someone unfamiliar understand your explanation?"] },

      // ── Phase 8: Browser Internals & Networking ──
      brw1: { what: "The Critical Rendering Path (CRP) is the sequence of steps the browser takes to convert HTML, CSS, and JS into visible pixels: DOM construction → CSSOM construction → Render Tree → Layout → Paint → Composite.", why: "Google specifically tests CRP in frontend rounds. Understanding it is the foundation for all performance optimisation work. It's the most common 'how does the browser work?' interview question.", points: ["DOM and CSSOM must both be ready before the Render Tree can be built", "CSS is render-blocking — the browser won't paint until all CSS is loaded", "Inline critical CSS to unblock the first render; defer non-critical CSS", "Use Chrome DevTools Performance tab to record and inspect each CRP phase"] },
      brw2: { what: "Reflow (layout) recalculates element sizes and positions. Repaint redraws pixels without geometry changes. Compositing moves already-painted layers on the GPU — the cheapest operation.", why: "Triggering reflow inside a loop ('layout thrashing') is one of the most common performance bugs in production apps. Google and Meta engineers are expected to avoid it instinctively.", points: ["Reading layout properties (offsetWidth, getBoundingClientRect) then writing forces synchronous reflow", "Batch DOM reads separately from writes — use requestAnimationFrame", "will-change: transform promotes an element to its own GPU layer — great for animations", "transform + opacity only trigger compositing (no reflow/repaint) — the 'jank-free' pair"] },
      brw3: { what: "V8 is Google's JavaScript engine (used in Chrome and Node.js). It compiles JS to machine code via JIT (Just-In-Time) compilation. Hidden classes optimise property access. The garbage collector uses mark-and-sweep + generational collection.", why: "Google interviews sometimes ask about V8 internals. Understanding JIT and hidden classes explains why certain JS patterns are faster, and why you should avoid dynamically adding properties to objects.", points: ["Hidden classes: objects with the same property order share a class — faster property lookup", "JIT: hot code paths are compiled to native machine code for speed", "Avoid delete — it deoptimises hidden classes", "Generational GC: most objects die young (minor GC) — avoid long-lived temporary objects"] },
      brw4: { what: "HTTP/1.1 uses one request per TCP connection (with pipelining workarounds). HTTP/2 multiplexes multiple streams over one connection, with header compression (HPACK) and server push. HTTP/3 runs over QUIC (UDP) — eliminates TCP head-of-line blocking.", why: "HTTP/2 and HTTP/3 change how you optimise front ends — domain sharding and CSS sprites are anti-patterns in HTTP/2. Google's products run on HTTP/3. Protocol knowledge is expected at senior level.", points: ["HTTP/2 multiplexing: one connection, many parallel streams — no domain sharding needed", "HPACK header compression reduces overhead on repeat requests", "HTTP/3 / QUIC: connection migration (phone → WiFi) without dropping the connection", "Server Push (HTTP/2) is largely deprecated — use preload hints instead"] },
      brw5: { what: "A DNS lookup resolves a domain to an IP address. Then a TCP 3-way handshake establishes the connection. TLS adds a further handshake for encryption. Together this takes 100-300ms before the first byte is sent.", why: "Understanding the full request lifecycle (DNS → TCP → TLS → HTTP) is essential for TTFB optimisation and explaining latency in system design rounds.", points: ["DNS: check cache → recursive resolver → root → TLD → authoritative nameserver", "TCP: SYN → SYN-ACK → ACK (1 round trip before any data)", "TLS 1.3 reduces handshake to 1 RTT (down from 2 in TLS 1.2)", "preconnect hint: <link rel='preconnect' href='https://api.example.com'> pre-warms the connection"] },
      brw6: { what: "The async attribute downloads the script in parallel and executes it as soon as it's ready (may block HTML parsing). defer downloads in parallel and executes after HTML is fully parsed, in document order. type='module' scripts are deferred by default.", why: "Incorrect script loading is a classic cause of render-blocking and race conditions. Google tests this in vanilla JS rounds as it reveals understanding of the browser's HTML parser.", points: ["<script> (bare): blocks HTML parsing entirely — never use for large scripts", "async: good for independent scripts (analytics) where order doesn't matter", "defer: best for app scripts — executes in order, after DOM is ready", "<script type='module'>: deferred + strict mode + own scope — the modern default"] },
      brw7: { what: "CORS (Cross-Origin Resource Sharing) is a browser security mechanism that restricts cross-origin HTTP requests. Simple requests go directly; complex requests send a preflight OPTIONS request first. The server must respond with the right Access-Control headers.", why: "CORS errors are one of the most commonly misunderstood issues in frontend development. FAANG interviews test whether you know it's a server-side fix, not a client-side one.", points: ["Simple request: GET/POST with safe headers — no preflight", "Preflight: OPTIONS request checks if server allows the actual method and headers", "Access-Control-Allow-Origin: * allows all origins (never use on authenticated endpoints)", "Credentials (cookies) require Access-Control-Allow-Credentials: true AND explicit origin (not *)"] },

      // ── Phase 9: Advanced JS & Design Patterns ──
      adv1: { what: "Generators are functions that can pause execution at yield and resume later. They implement the iterator protocol. async generators combine both for async iteration.", why: "Generators power many advanced patterns — infinite sequences, lazy pipelines, async state machines, Redux-Saga middleware. They appear in senior FAANG rounds testing deep JS knowledge.", points: ["function* gen() { yield 1; yield 2; } — calling gen() returns an iterator", "gen.next() returns { value, done } — call until done is true", "for...of loop consumes an iterator automatically", "yield* delegates to another iterable — enables generator composition"] },
      adv2: { what: "Proxy wraps an object and intercepts operations via 'traps' (get, set, has, deleteProperty, apply, construct). Reflect provides the default implementations of those operations.", why: "Proxy is how Vue 3's reactivity system works. Understanding it shows deep JS mastery and is asked in senior Google/Meta rounds. It's also used for validation, logging, and sandboxing.", points: ["const p = new Proxy(target, { get(t, k) { return k in t ? t[k] : 'default' } })", "Reflect.get(target, key, receiver) — mirrors the default get behaviour", "Use Proxy for observable state, access logging, and input validation", "Proxy can't intercept private class fields (#field) — only public properties"] },
      adv3: { what: "WeakMap holds key-value pairs where keys are objects held weakly — if the key object is garbage collected, the entry is automatically removed. WeakRef creates a weak reference to an object. FinalizationRegistry runs a callback when an object is collected.", why: "Memory leaks are a critical production issue. WeakMap is the correct tool for private object data and caches that shouldn't prevent GC. FAANG interviewers test whether you know when to use Weak collections.", points: ["WeakMap is not iterable — no .keys(), .values(), or .forEach()", "Perfect for: component metadata, DOM node state, private class fields (pre-#)", "Common leak pattern: global Map holding DOM node references — nodes never GC'd", "WeakRef: get() returns the object or undefined if it's been collected"] },
      adv4: { what: "Memory leaks occur when objects are referenced longer than needed, preventing garbage collection. Common causes: forgotten event listeners, closures capturing outer scope, global variables, detached DOM nodes.", why: "Memory leak debugging is a senior-level skill. FAANG production apps must stay under memory budgets. Interviewers ask you to identify leaks in code snippets.", points: ["Forgotten addEventListener without removeEventListener — multiplies on rerenders", "Closure in setInterval keeps entire outer scope alive — clear intervals in cleanup", "Detached DOM nodes held in a variable — GC can't collect them", "Chrome DevTools Memory tab: heap snapshot, allocation timeline, detached nodes filter"] },
      adv5: { what: "Creational patterns: Factory (creates objects via a function), Singleton (one instance), Builder (step-by-step construction). Structural: Decorator (wraps to add behaviour), Facade (simplifies complex API), Proxy (intercepts access). Behavioural: Observer (pub/sub), Strategy (swap algorithms), Command (encapsulate actions).", why: "Design patterns appear in Google, Microsoft, and Meta senior rounds. They demonstrate architectural thinking and the ability to communicate solutions using a shared vocabulary.", points: ["Observer: EventEmitter / DOM events are Observer pattern in practice", "Strategy: sort(compareFn) — swap the algorithm by passing a different function", "Facade: a service module hiding fetch logic from components is a Facade", "Command: undo/redo systems — each action is a Command object with execute() and undo()"] },
      adv6: { what: "Functional programming emphasises pure functions (no side effects), immutability, and function composition. Core tools: map/filter/reduce, compose (right-to-left), pipe (left-to-right), currying (partial application).", why: "FP concepts are used daily in React (pure components, immutable state) and tested in senior interviews. Google and Meta engineers are expected to write side-effect-free, predictable code.", points: ["Pure function: same input always returns same output, no external state changes", "compose(f, g)(x) = f(g(x)) — apply g first, then f", "pipe(f, g)(x) = g(f(x)) — apply left to right — more readable", "Currying: add(a)(b) = a + b — partially apply args, enable reuse as add(5)"] },
      adv7: { what: "Symbols are unique, immutable primitive values used as object property keys that never collide with string keys. Well-known Symbols (Symbol.iterator, Symbol.toPrimitive, Symbol.hasInstance) let objects customise built-in JS behaviour.", why: "Symbols and iterators underpin 'for...of', spread, destructuring, and generator protocols. Senior candidates at Google/Meta are expected to understand the JS metaprogramming layer.", points: ["Symbol('desc') !== Symbol('desc') — every symbol is unique", "Object[Symbol.iterator] = function*() { yield... } — makes object iterable", "Symbol.toPrimitive controls type coercion: obj + 1 can be customised", "Symbols as keys are not returned by Object.keys() or JSON.stringify()"] },

      // ── Phase 10: Tooling, i18n & Advanced TypeScript ──
      tool1: { what: "Git workflows for teams: GitFlow (feature/develop/release/hotfix branches), GitHub Flow (feature branches + PRs into main), Trunk-Based Development (short-lived branches, merge daily). Rebase rewrites history for clean linear commits; merge preserves full history.", why: "Every FAANG team has a branching strategy. Knowing the trade-offs of rebase vs merge, and GitFlow vs trunk-based, is expected at senior level and comes up in system/process design discussions.", points: ["Trunk-based dev + feature flags is the FAANG standard — enables CI/CD", "git rebase -i HEAD~3 — interactive rebase to squash/reorder commits", "git bisect uses binary search to find the commit that introduced a bug", "Conventional commits (feat:, fix:, chore:) enable automated changelogs + semver bumps"] },
      tool2: { what: "GitHub Actions (or GitLab CI, CircleCI) run automated workflows on push/PR: install dependencies, lint, run tests, build, deploy. A well-configured CI pipeline catches bugs before they reach main.", why: "Every FAANG team runs CI. Being able to write and debug CI configs is a senior engineering expectation. Microsoft, Google, and Meta all use CI/CD as a core practice.", points: ["on: [push, pull_request] — trigger on push or PR events", "Use caching: actions/cache@v3 for node_modules — cuts install time by 70%", "Matrix builds: test across Node 18, 20, 22 in parallel", "Fail fast: run lint before tests — catch cheap errors first"] },
      tool3: { what: "ESLint statically analyses code for bugs and style. Prettier auto-formats code. Husky adds Git hooks (pre-commit, pre-push). lint-staged runs linters only on staged files — fast pre-commit checks.", why: "Code quality tooling is standard at every FAANG team. Being able to configure and extend ESLint rules demonstrates engineering maturity. Interviewers ask about code review standards.", points: ["eslint-config-airbnb is the most widely used base config at top companies", "prettier --write src/ fixes formatting; integrate into IDE on save", "husky install + .husky/pre-commit: npx lint-staged — blocks bad commits", "ESLint rule: 'no-console': 'warn' — prevent accidental console.log in production"] },
      tool4: { what: "Internationalisation (i18n) adapts software for multiple languages and regions. Localisation (l10n) is the actual translation. The Intl API provides number, date, and currency formatting natively. RTL (right-to-left) support requires layout mirroring.", why: "Microsoft (global products), Google, and Meta all ship products in 50+ languages. i18n is a frequent senior interview topic, especially at Microsoft. Poor i18n causes revenue loss in non-English markets.", points: ["Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(1234.5)", "Intl.DateTimeFormat with timeZone option — never hardcode date strings", "react-i18next: useTranslation() hook, <Trans> component for JSX interpolation", "RTL: use logical CSS properties (margin-inline-start) instead of margin-left — auto-mirrors in RTL"] },
      tool5: { what: "Cross-browser compatibility ensures your app works across Chrome, Firefox, Safari, and Edge. Feature detection checks if a feature exists before using it. Polyfills provide modern API implementations in older browsers.", why: "Safari (WebKit) consistently lags on web APIs and is the main compatibility pain point at FAANG. Knowing feature detection over browser sniffing, and when to polyfill, is expected.", points: ["Feature detection: if ('IntersectionObserver' in window) vs navigator.userAgent sniffing", "caniuse.com — check browser support for any CSS/JS feature", "core-js is the standard polyfill library for JS features", "@supports (display: grid) {} — CSS feature query, like @media but for feature support"] },
      tool6: { what: "Advanced TypeScript: conditional types (T extends U ? X : Y), mapped types (transform every property), template literal types (build string types from combinations), the infer keyword (extract a type from another), decorators (metadata + behaviour annotations).", why: "Microsoft invented TypeScript and uses advanced types heavily. Google and Meta TypeScript codebases use conditional and mapped types extensively. Senior TS questions appear in all FAANG rounds.", points: ["Conditional: type IsArray<T> = T extends any[] ? true : false", "Mapped: type Optional<T> = { [K in keyof T]?: T[K] }", "infer: type ReturnType<T> = T extends (...args: any[]) => infer R ? R : never", "Template literal: type EventName = `on${Capitalize<string>}` — builds string unions"] },
      tool7: { what: "Docker packages an application and its dependencies into a container — a lightweight, portable environment. For frontend devs: containerising dev environments, running Node services locally, and understanding deployment pipelines.", why: "Frontend engineers at FAANG interact with Docker daily for local development, CI/CD, and deploying Node.js servers. Senior roles expect you to read and write basic Dockerfiles.", points: ["FROM node:20-alpine — start from a minimal Node image", "COPY package*.json ./ && RUN npm ci — copy lockfile and install before copying source (layer cache)", "docker-compose.yml spins up frontend + API + DB locally in one command", "Multi-stage builds: build in one stage, copy only dist/ to the final image — smaller prod image"] }
    };

    // ── FAANG Interview Questions per phase ──
    const PHASE_QUESTIONS = {
      p8: [
        { q: "What happens when you type a URL and press Enter? Walk through every step: DNS → TCP → TLS → HTTP → rendering.", diff: "hard", co: "Google", hint: "Cover: DNS cache → recursive resolver → root/TLD/authoritative NS → TCP 3-way handshake (SYN/SYN-ACK/ACK) → TLS 1.3 (1 RTT) → HTTP GET → server response → CRP: DOM construction + CSSOM → Render Tree → Layout → Paint → Composite layers." },
        { q: "Explain the Critical Rendering Path. How would you optimise it to improve LCP from 4s to under 2.5s?", diff: "hard", co: "Google", hint: "Inline critical CSS to unblock first paint. Add fetchpriority='high' on the LCP image. Use preload for hero image. Defer non-critical JS. Reduce TTFB with CDN edge caching. Remove render-blocking resources from the head." },
        { q: "What is layout thrashing? Write code that causes it, then rewrite it to fix the performance problem.", diff: "hard", co: "Google", hint: "Thrashing = alternating DOM reads (offsetWidth) and writes (style.width) in a loop — forces synchronous reflow each iteration. Fix: batch all reads first, then all writes. Or use requestAnimationFrame to defer writes to next frame." },
        { q: "Explain the difference between HTTP/1.1, HTTP/2, and HTTP/3. What specific problem does QUIC solve?", diff: "med", co: "All", hint: "HTTP/1.1: one request per connection (pipelining unreliable). HTTP/2: multiplexes streams over one TCP connection, but TCP head-of-line blocking still stalls all streams if one packet is lost. HTTP/3 + QUIC: runs over UDP, so a lost packet only blocks the affected stream." },
        { q: "What is a CORS preflight? When is it triggered and how does the server properly allow it?", diff: "med", co: "All", hint: "Preflight = OPTIONS request for non-simple requests (custom headers, PUT/PATCH/DELETE, Content-Type: application/json). Server must respond: Access-Control-Allow-Origin, Access-Control-Allow-Methods, Access-Control-Allow-Headers. Max-Age caches the preflight." },
        { q: "What is the difference between async, defer, and a bare script tag? What is the execution order when mixing them?", diff: "med", co: "Microsoft", hint: "Bare: blocks HTML parsing immediately. Async: downloads in parallel, executes as soon as ready — can block parser mid-parse, order not guaranteed. Defer: downloads in parallel, executes after full DOM parse, in document order. Type=module is deferred by default." },
      ],
      p1: [

          theory: "An accessible modal needs four things: correct ARIA so screen readers know it's a dialog, focus management so keyboard users don't get lost, focus trapping so Tab key stays inside the modal, and returning focus when it closes. When the modal opens, focus must move to the first interactive element inside it. The Tab and Shift+Tab keys should cycle only within the modal. Pressing Escape should close it. When it closes, focus should return to whichever button triggered it.",
          example: "Without focus trapping, a keyboard user opens a modal then presses Tab — focus escapes to the page behind, but the modal is covering it. They're effectively stuck. Proper focus trapping keeps them in the modal where they can interact with it.",
          code: "function openModal(triggerBtn) {\n  const modal = document.getElementById('modal');\n  const focusable = modal.querySelectorAll(\n    'button, [href], input, select, textarea, [tabindex]:not([tabindex=\"-1\"])'\n  );\n  const first = focusable[0], last = focusable[focusable.length - 1];\n\n  modal.setAttribute('aria-hidden', 'false');\n  modal.removeAttribute('hidden');\n  first.focus(); // move focus into modal\n\n  modal.addEventListener('keydown', e => {\n    if (e.key === 'Escape') closeModal(triggerBtn);\n    if (e.key === 'Tab') {\n      if (e.shiftKey && document.activeElement === first) {\n        e.preventDefault(); last.focus(); // wrap to last\n      } else if (!e.shiftKey && document.activeElement === last) {\n        e.preventDefault(); first.focus(); // wrap to first\n      }\n    }\n  });\n}\nfunction closeModal(triggerBtn) {\n  document.getElementById('modal').setAttribute('aria-hidden','true');\n  triggerBtn.focus(); // return focus to trigger\n}"
        },
        {
          theory: "By default, CSS uses 'content-box' sizing — the width you declare only covers the content area. Padding and border are added on top. So if you say width: 200px and add padding: 20px, the element actually occupies 240px. This surprises everyone. 'border-box' changes the calculation so that width includes padding and border — a 200px element with 20px padding stays 200px wide, and the content area shrinks. Modern CSS resets apply border-box everywhere because it matches how designers think.",
          example: "Imagine ordering a box that's 200cm wide. Content-box means the box itself is 200cm but the packaging adds extra width — you get a 240cm surprise. Border-box means the total thing including packaging is exactly 200cm — what you asked for.",
          code: "/* Modern global reset — always include this */\n*, *::before, *::after {\n  box-sizing: border-box;\n}\n\n/* Now this element is exactly 200px wide in total */\n.box {\n  width: 200px;\n  padding: 20px;   /* included in 200px, not added to it */\n  border: 2px solid black; /* also included */\n}\n/* Without border-box: total width = 200 + 40 (padding) + 4 (border) = 244px */\n/* With    border-box: total width = 200px exactly */"
        },
        {
          theory: "CSS positioning removes elements from or adjusts them within the normal document flow. 'relative' keeps the element in its original spot in the flow but lets you nudge it with top/left — other elements don't notice the nudge. 'absolute' removes it from the flow entirely and positions it relative to the nearest ancestor with position other than static. 'fixed' removes it from flow and positions it relative to the browser viewport — it stays put when you scroll. 'sticky' is a hybrid: it behaves like relative until you scroll past a threshold, then sticks like fixed.",
          example: "Think of sticky headers on websites — they scroll with you normally, then stick to the top when you reach them. That's position: sticky in action. Fixed navbars that are always at the top regardless of scroll? That's position: fixed.",
          code: "/* relative — nudged but still in flow */\n.badge {\n  position: relative;\n  top: -2px; /* shift up 2px without affecting layout */\n}\n\n/* absolute — positioned to nearest positioned ancestor */\n.card { position: relative; } /* establishes containing block */\n.card .close-btn {\n  position: absolute;\n  top: 8px; right: 8px; /* top-right corner of .card */\n}\n\n/* fixed — always visible, scrolls with viewport */\n.navbar { position: fixed; top: 0; left: 0; width: 100%; }\n\n/* sticky — scrolls normally, then locks at top */\nth { position: sticky; top: 0; background: white; }"

        {
          theory: "JavaScript runs on a single thread. When you call a function, it goes on the call stack. Synchronous code runs immediately. Promises use the microtask queue — when a promise resolves, its .then() callback waits in this queue. setTimeout uses the macrotask queue. The event loop rule is: run all synchronous code first (empty the call stack), then drain the entire microtask queue (all pending Promises), then take one macrotask (one setTimeout), then drain microtasks again, and so on. So Promise.then always runs before setTimeout, even setTimeout(fn, 0).",
          example: "Think of it like a restaurant. Synchronous code is the chef cooking. The microtask queue is the waiters who must deliver all current orders before any new table is seated. The macrotask queue is the new tables waiting outside. All existing waiters finish first, then one new table comes in.",
          code: "console.log('1 sync');          // runs immediately\n\nsetTimeout(() => {\n  console.log('4 setTimeout');    // macrotask — runs last\n}, 0);\n\nPromise.resolve().then(() => {\n  console.log('3 promise');       // microtask — runs before setTimeout\n});\n\nconsole.log('2 sync');           // runs immediately\n\n// Output order: 1, 2, 3, 4\n// Why: sync runs first (1, 2), then microtask queue (3), then macrotask (4)"
        },
        {
          theory: "Debounce delays a function call until a period of inactivity has passed. Every new call resets the timer. Good for search inputs — you only want to fire the API call after the user stops typing, not on every keystroke. Throttle limits how often a function can fire — it runs at most once per interval, ignoring extra calls in between. Good for scroll or resize handlers — you want them to fire regularly but not on every single pixel scroll.",
          example: "Debounce: imagine a lift that only closes its doors and moves when nobody has pressed a button for 3 seconds. Throttle: imagine a photographer who can only take one photo per second, no matter how fast you ask.",
          code: "// DEBOUNCE — fires after user stops typing for 'delay' ms\nfunction debounce(fn, delay) {\n  let timer;\n  return function(...args) {\n    clearTimeout(timer);              // reset the clock\n    timer = setTimeout(() => fn.apply(this, args), delay);\n  };\n}\nconst onSearch = debounce(fetchResults, 300);\n\n// THROTTLE — fires at most once per 'interval' ms\nfunction throttle(fn, interval) {\n  let lastCall = 0;\n  return function(...args) {\n    const now = Date.now();\n    if (now - lastCall >= interval) {\n      lastCall = now;\n      fn.apply(this, args);\n    }\n  };\n}\nconst onScroll = throttle(updateUI, 100);"
        },
        {
          theory: "A closure is created when an inner function remembers the variables from the outer function that created it — even after the outer function has finished running. It's like the inner function carries a backpack containing all the variables it could see when it was born. This is how you create 'private' state in JavaScript — variables that exist and persist but can't be accessed or changed from outside.",
          example: "Think of a bank account. The balance is private — you can't just reach in and change it. But you can interact with it through the deposit, withdraw, and getBalance functions. Those functions are closures — they remember the 'balance' variable from the outer function.",
          code: "function createCounter() {\n  let count = 0;  // 'count' is private — only the returned\n                  // functions can access it\n  return {\n    increment: () => ++count,\n    decrement: () => --count,\n    reset:     () => { count = 0; },\n    getCount:  () => count\n  };\n}\n\nconst counter = createCounter();\ncounter.increment(); // 1\ncounter.increment(); // 2\ncounter.decrement(); // 1\nconsole.log(counter.count);     // undefined — it's private!\nconsole.log(counter.getCount()); // 1"
        },
        {
          theory: "The brute force is to check every pair of numbers with two nested loops — O(n²). The O(n) trick uses a Map (hash table). You iterate the array once: for each number, you calculate what value you'd need to reach the target (complement = target - num), then check if that complement is already in the Map. If yes, you found your pair. If no, add the current number to the Map and move on. One pass = O(n).",
          example: "You're at a party looking for someone to pair with to make a team of height 180cm. Instead of measuring every possible pair, you walk around and whenever you meet someone of height 80cm, you call out 'anyone here 100cm?' If someone raises their hand, done. If not, you note your height on a board and keep walking.",
          code: "function twoSum(nums, target) {\n  const seen = new Map(); // value → index\n\n  for (let i = 0; i < nums.length; i++) {\n    const complement = target - nums[i];\n\n    if (seen.has(complement)) {\n      return [seen.get(complement), i]; // found!\n    }\n\n    seen.set(nums[i], i); // remember this number's index\n  }\n\n  return []; // no solution\n}\n\ntwoSum([2, 7, 11, 15], 9); // [0, 1] — nums[0]+nums[1] = 2+7 = 9"
        },
        {
          theory: "An LRU (Least Recently Used) cache has a fixed size and evicts the item that was least recently used when full. You need O(1) for both get and put. A JavaScript Map gives you O(1) lookup AND preserves insertion order — the first entry is the oldest (least recently used). On a get, delete the key and re-insert it to move it to 'most recently used' position. On a put when full, delete the first key (Map.keys().next().value = oldest = LRU).",
          example: "Think of your browser's open tabs. You have 10 tabs max. You always close the tab you haven't visited in the longest time. Every time you visit a tab, it becomes 'most recently used'. The one you haven't visited longest gets closed when you need to open a new one.",
          code: "class LRUCache {\n  constructor(capacity) {\n    this.capacity = capacity;\n    this.cache = new Map(); // preserves insertion order\n  }\n\n  get(key) {\n    if (!this.cache.has(key)) return -1;\n    const value = this.cache.get(key);\n    this.cache.delete(key);   // remove from current position\n    this.cache.set(key, value); // re-insert at end (most recent)\n    return value;\n  }\n\n  put(key, value) {\n    if (this.cache.has(key)) this.cache.delete(key);\n    else if (this.cache.size >= this.capacity) {\n      // Delete LRU: first key in Map = least recently used\n      this.cache.delete(this.cache.keys().next().value);\n    }\n    this.cache.set(key, value);\n  }\n}"
        },
        {
          theory: "The recursive approach checks each element: if it's an array, recursively flatten it; if it's not, add it to the result. The iterative approach uses a stack — push all items of the input onto a stack, then pop one at a time: if it's an array, spread its items back onto the stack; otherwise push to the result. The iterative version is safer for very deeply nested arrays because recursion can overflow the call stack.",
          example: "Think of unwrapping nested gift boxes. Recursive: open each box, if you find another box inside, open that too before continuing. Iterative: put all boxes in a pile, pick the top one, if it contains more boxes put them on the pile, otherwise take out the item.",
          code: "// Recursive\nfunction flattenRecursive(arr) {\n  const result = [];\n  for (const item of arr) {\n    if (Array.isArray(item)) {\n      result.push(...flattenRecursive(item)); // recurse\n    } else {\n      result.push(item);\n    }\n  }\n  return result;\n}\n\n// Iterative (stack-based — no call stack overflow risk)\nfunction flattenIterative(arr) {\n  const stack = [...arr];\n  const result = [];\n  while (stack.length) {\n    const item = stack.pop();\n    if (Array.isArray(item)) {\n      stack.push(...item); // spread back onto stack\n    } else {\n      result.unshift(item); // add to front to maintain order\n    }\n  }\n  return result;\n}\n\nflattenIterative([[1,[2]],[[3],4]]); // [1, 2, 3, 4]"
        }

        {
          theory: "An EventEmitter lets you subscribe to named events and emit them later. It's the same pattern as DOM addEventListener but for your own objects. The key data structure is a Map where each key is an event name and the value is a Set of listener functions. Using a Set instead of an array automatically prevents the same listener from being added twice, and removal is O(1) instead of O(n).",
          example: "Think of a news website. You (and thousands of others) subscribe to 'breaking news'. The website's publishing system emits 'breaking news' with a headline. Everyone subscribed gets notified. You can unsubscribe any time and stop getting alerts.",
          code: "class EventEmitter {\n  constructor() {\n    this.events = new Map(); // eventName → Set of functions\n  }\n\n  on(event, fn) {\n    if (!this.events.has(event)) this.events.set(event, new Set());\n    this.events.get(event).add(fn);\n    return this; // enable chaining: ee.on('x', f).on('y', g)\n  }\n\n  off(event, fn) {\n    this.events.get(event)?.delete(fn);\n    return this;\n  }\n\n  emit(event, ...args) {\n    this.events.get(event)?.forEach(fn => fn(...args));\n    return this;\n  }\n}\n\nconst ee = new EventEmitter();\nee.on('data', val => console.log('got:', val));\nee.emit('data', 42); // logs: got: 42"

        {
          theory: "Vue 3's reactivity works by wrapping your data object in a Proxy with get and set traps. When a component reads a property (get trap), Vue records 'this component depends on this property'. When the property is written (set trap), Vue looks up all components that depend on it and re-renders them. This is automatic dependency tracking — you never have to manually tell Vue what depends on what.",
          example: "It's like a spreadsheet formula. When cell B1 contains =A1*2, the spreadsheet knows B1 depends on A1. Change A1 and B1 automatically updates. Proxy lets Vue build this dependency map invisibly as your code runs.",
          code: "// Simple reactive() that logs reads and writes\nfunction reactive(obj) {\n  return new Proxy(obj, {\n    get(target, key, receiver) {\n      console.log(`Reading: ${key}`);\n      // In Vue 3: track(target, key) — records the dependency\n      return Reflect.get(target, key, receiver);\n    },\n    set(target, key, value, receiver) {\n      console.log(`Writing: ${key} = ${value}`);\n      const result = Reflect.set(target, key, value, receiver);\n      // In Vue 3: trigger(target, key) — re-renders dependents\n      return result;\n    }\n  });\n}\n\nconst state = reactive({ count: 0 });\nstate.count;     // logs: Reading: count\nstate.count = 5; // logs: Writing: count = 5"

          theory: "Memoize wraps a function so it remembers its previous results. The first time you call it with specific arguments, it runs the function and stores the result. The next time you call it with the same arguments, it returns the stored result instantly without running the function again. For multiple arguments, you need a cache key that captures all of them — JSON.stringify(args) is the simplest way.",
          example: "Think of asking your calculator to compute 999 * 999. First time: it actually multiplies. Next time you ask the same question: it just reads the answer from memory. For expensive functions (complex calculations, API calls), this saves enormous time.",
          code: "function memoize(fn) {\n  const cache = new Map();\n\n  return function(...args) {\n    const key = JSON.stringify(args); // works for multiple args\n\n    if (cache.has(key)) {\n      return cache.get(key); // return cached result\n    }\n\n    const result = fn.apply(this, args);\n    cache.set(key, result);\n    return result;\n  };\n}\n\n// Example: slow fibonacci becomes fast\nconst fib = memoize(function(n) {\n  if (n <= 1) return n;\n  return fib(n - 1) + fib(n - 2);\n});\n\nfib(40); // fast — each value computed only once"
        },
        {
          theory: "Pipe takes a list of functions and returns a new function that passes a value through each function in order, left to right — the output of each becomes the input of the next. It's the most natural way to write data transformation pipelines in functional programming. The implementation is just a reduce: start with the initial value and apply each function in turn.",
          example: "Think of a car wash: dirty car → rinse → soap → rinse again → dry → clean car. Each step takes what the previous step produced. Pipe is the mechanism for chaining these steps.",
          code: "// pipe: applies functions left-to-right\nconst pipe = (...fns) => (x) => fns.reduce((v, fn) => fn(v), x);\n\n// compose: applies functions right-to-left (reverse)\nconst compose = (...fns) => (x) => fns.reduceRight((v, fn) => fn(v), x);\n\n// Example usage\nconst double   = x => x * 2;\nconst addOne   = x => x + 1;\nconst square   = x => x * x;\n\nconst transform = pipe(double, addOne, square);\ntransform(3); // double(3)=6, addOne(6)=7, square(7)=49\n\n// Same with compose runs right-to-left:\nconst transform2 = compose(square, addOne, double);\ntransform2(3); // double(3)=6, addOne(6)=7, square(7)=49"
        },
        {
          theory: "Memory leaks in React most often come from useEffect not returning a cleanup function. If you add an event listener, start a timer, or open a WebSocket inside useEffect, you must return a function that removes/clears/closes it. Without cleanup, the listener/timer/socket stays alive even after the component unmounts — and if the component mounts again (e.g. on navigation), you get another one. Over time they pile up and eat memory. To diagnose: use Chrome DevTools Memory tab — take heap snapshots before and after navigation, switch to 'Comparison' view, and look for objects with increasing count.",
          example: "Imagine adding a new Post-it note to your wall every time you open a drawer, but never taking old ones down. After 100 openings you have 100 identical Post-its. That's a leak. Cleanup is the rule: 'when you leave, take your Post-it'.",
          code: "// LEAKING — event listener never removed\nuseEffect(() => {\n  window.addEventListener('resize', handleResize);\n  // Missing cleanup! Every re-mount adds another listener.\n}, []);\n\n// FIXED — cleanup removes the listener on unmount\nuseEffect(() => {\n  window.addEventListener('resize', handleResize);\n  return () => {\n    window.removeEventListener('resize', handleResize);\n  };\n}, []);\n\n// Diagnose in Chrome:\n// 1. DevTools → Memory tab\n// 2. Take Heap Snapshot (baseline)\n// 3. Navigate away and back a few times\n// 4. Take another Heap Snapshot\n// 5. Set view to 'Comparison' — look for growing object counts"
        },
        {
          theory: "A generator function (marked with function*) can pause its execution at each yield statement and resume later from exactly where it left off. This lets you create infinite sequences without infinite loops — the value is only computed when you ask for the next one. Each call to generator.next() runs until the next yield, returns { value, done }, then pauses again.",
          example: "Think of a book with numbered pages. You don't print all pages in advance — you print each page only when someone turns to it. The generator is the printing press that knows what comes next and produces it on demand.",
          code: "// Infinite Fibonacci generator\nfunction* fibonacci() {\n  let [a, b] = [0, 1];\n  while (true) {       // infinite loop is fine — we yield not loop\n    yield a;\n    [a, b] = [b, a + b];\n  }\n}\n\n// Take first N values from any generator\nfunction take(gen, n) {\n  const results = [];\n  for (const value of gen) {  // for...of calls .next() automatically\n    results.push(value);\n    if (results.length === n) break;\n  }\n  return results;\n}\n\ntake(fibonacci(), 8); // [0, 1, 1, 2, 3, 5, 8, 13]"
        }

          theory: "React's reconciler compares the previous virtual DOM tree with the new one after a state change. When it encounters a list, it needs to match old list items to new ones to decide what to reuse, update, or delete. Keys are how it does this matching. Without keys (or with index keys), if you reorder a list React matches by position — item at index 0 is assumed to be the same item. If you prepend a new item, React thinks every item changed, destroying and recreating all DOM nodes. With stable unique ID keys, React knows exactly which element is which regardless of position.",
          example: "Imagine 5 people in a queue. Without name tags (keys), if a new person joins at the front, you think person 1 is a new person, person 2 has replaced person 1, etc. With name tags, you instantly know 'this is still Alice, just in a different position'.",
          code: "// BAD — index keys: reordering causes all items to re-render\n// and component state (like input values) bleeds to wrong items\n{items.map((item, index) => (\n  <TodoItem key={index} item={item} />\n))}\n\n// GOOD — stable unique ID: React correctly identifies each item\n{items.map(item => (\n  <TodoItem key={item.id} item={item} />\n))}\n\n// Why it matters: if TodoItem has internal state (e.g., expanded),\n// wrong keys cause that state to appear on the wrong item after sort/prepend"
        },
        {
          theory: "useMemo memoizes a computed value — it runs an expensive calculation once and caches the result, only recalculating when its dependencies change. useCallback memoizes a function reference — it returns the same function object across renders, so child components that receive it as a prop don't get a 'new' function every render. The key insight: in React, every render creates new function literals. React.memo on a child component only prevents re-renders if all props are referentially equal — but an inline function is never equal to itself across renders.",
          example: "useMemo is like caching the answer to '1000 × 999' so you don't recalculate it every time. useCallback is like keeping the same phone number for your friend — if you got a new number every day, their phone book entry would always be stale and they'd think you were a stranger.",
          code: "// useCallback: prevents child re-render\nfunction Parent({ id }) {\n  // Without useCallback: new function on every Parent render\n  // → Child's React.memo bailout fails → Child re-renders unnecessarily\n  const handleClick = useCallback(() => {\n    doSomething(id);\n  }, [id]); // same function reference unless 'id' changes\n\n  return <Child onClick={handleClick} />; // Child is React.memo wrapped\n}\n\n// useMemo: prevents expensive recalculation\nfunction SearchResults({ items, query }) {\n  // Only re-filters when items or query changes\n  const filtered = useMemo(\n    () => items.filter(i => i.name.includes(query)),\n    [items, query]\n  );\n  return filtered.map(i => <div key={i.id}>{i.name}</div>);\n}"
        },
        {
          theory: "useDebounce is a custom hook that takes a value and a delay, and returns a 'debounced' version of that value that only updates after the user has stopped changing it for 'delay' milliseconds. Inside, it uses useState to hold the debounced value and useEffect with setTimeout to update it. The cleanup function clears the previous timeout on every change, so the timeout only fires after the user stops.",
          example: "You're typing a search query. Without debounce: an API call fires on every single keystroke — 'r', 're', 'rea', 'reac', 'react' = 5 calls. With debounce(300ms): only one call fires after you stop typing for 300ms. Fewer calls, better performance.",
          code: "// The custom hook\nfunction useDebounce(value, delay) {\n  const [debounced, setDebounced] = useState(value);\n\n  useEffect(() => {\n    const timer = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(timer); // cancel if value changes\n  }, [value, delay]);\n\n  return debounced;\n}\n\n// Usage in a search component\nfunction Search() {\n  const [input, setInput] = useState('');\n  const query = useDebounce(input, 300); // only updates 300ms after typing stops\n\n  useEffect(() => {\n    if (query) fetchResults(query); // API call fires only on debounced value\n  }, [query]);\n\n  return <input value={input} onChange={e => setInput(e.target.value)} />;\n}"
        },
        {
          theory: "React 18's startTransition tells React that a particular state update is 'non-urgent' — it can be interrupted and deferred so urgent updates (like responding to typing) stay fast. Without it, a heavy state update (like filtering 10,000 items) blocks React's render cycle and the UI freezes. With useTransition, React will pause the heavy update when the user types, keeping the input responsive, and resume the filter calculation in the background.",
          example: "Imagine typing in a search box while the results list updates. Without startTransition: every keystroke triggers a full re-render of 10,000 items — input feels laggy. With startTransition: input updates instantly every keystroke, and the list catches up a fraction of a second later without blocking the input.",
          code: "function HeavyFilter({ items }) {\n  const [input, setInput] = useState('');\n  const [filtered, setFiltered] = useState(items);\n  const [isPending, startTransition] = useTransition();\n\n  function handleChange(e) {\n    const val = e.target.value;\n    setInput(val); // urgent: update input immediately\n\n    startTransition(() => {\n      // non-urgent: React can pause this if user keeps typing\n      setFiltered(items.filter(i => i.name.includes(val)));\n    });\n  }\n\n  return (\n    <>\n      <input value={input} onChange={handleChange} />\n      {isPending && <span>Updating...</span>}\n      {filtered.map(i => <div key={i.id}>{i.name}</div>)}\n    </>\n  );\n}"
        },
        {
          theory: "Virtual scrolling (windowing) is the technique of only rendering the list items that are currently visible in the viewport, rather than all 10,000. The trick is: set the outer container to a fixed height with scroll, set the inner container's total height to itemHeight × totalItems (so the scrollbar looks correct), calculate which items are visible based on scrollTop, and render only those items with absolute positioning.",
          example: "Think of a cinema with 10,000 seats. You don't manufacture all 10,000 seats — you only build the 20 visible from where the camera is. As the camera moves (the user scrolls), you quickly move some seats to new positions. At any moment, only 20 seats exist.",
          code: "function VirtualList({ items, itemHeight = 40 }) {\n  const [scrollTop, setScrollTop] = useState(0);\n  const containerHeight = 400;\n  const buffer = 3;\n\n  const startIdx = Math.max(0, Math.floor(scrollTop / itemHeight) - buffer);\n  const visibleCount = Math.ceil(containerHeight / itemHeight) + buffer * 2;\n  const endIdx = Math.min(items.length, startIdx + visibleCount);\n\n  return (\n    <div\n      style={{ height: containerHeight, overflow: 'auto', position: 'relative' }}\n      onScroll={e => setScrollTop(e.target.scrollTop)}\n    >\n      {/* Full-height inner div makes scrollbar correct */}\n      <div style={{ height: items.length * itemHeight, position: 'relative' }}>\n        {items.slice(startIdx, endIdx).map((item, i) => (\n          <div\n            key={item.id}\n            style={{ position: 'absolute', top: (startIdx + i) * itemHeight,\n                     height: itemHeight, width: '100%' }}\n          >\n            {item.name}\n          </div>\n        ))}\n      </div>\n    </div>\n  );\n}"
        },
        {
          theory: "React requires hooks to be called in the exact same order on every render. If you call a hook conditionally or after an early return, React's internal array of hook values gets out of sync with the component's hook calls — React can't tell which stored value belongs to which hook. The fix is always to move every hook call to the top of the component, before any conditional return statements.",
          example: "Imagine React stores hook values like a numbered list: hook 1 = useState value, hook 2 = useEffect, hook 3 = another useState. If sometimes hook 2 runs and sometimes it doesn't, the values shift around — hook 3's value ends up in hook 2's slot. The list is misaligned.",
          code: "// BROKEN — early return before hooks\nfunction MyComponent({ user }) {\n  if (!user) return null; // ← early return\n  const [count, setCount] = useState(0); // hook after conditional!\n  // Error: 'Rendered fewer hooks than previous render'\n}\n\n// FIXED — all hooks at the top, always called\nfunction MyComponent({ user }) {\n  const [count, setCount] = useState(0); // hook first, always runs\n\n  if (!user) return null; // conditional return AFTER all hooks\n\n  return <div onClick={() => setCount(c => c + 1)}>{count}</div>;\n}\n\n// Rule: hooks must be at the TOP, not inside if/for/callbacks"
        }

      p4: [
        {
          theory: "Node's event loop has phases: timers (setTimeout, setInterval), pending I/O callbacks, idle/prepare (internal), poll (wait for new I/O), check (setImmediate), and close callbacks. process.nextTick is special — it's not part of the event loop phases at all. It runs immediately after the current operation completes, before moving to any phase. Microtasks (resolved Promises) also run between each phase. So the order is: synchronous code → nextTick → Promise microtasks → I/O callbacks → setImmediate.",
          example: "Think of it like a hospital triage system. nextTick is the most urgent patient (runs before anything else). Resolved Promises are urgent patients (run between every other task). setImmediate is the next scheduled appointment after current I/O work is done. setTimeout is an appointment for 'at some point after X ms'.",
          code: "Promise.resolve().then(() => console.log('3 Promise'));\nprocess.nextTick(() => console.log('2 nextTick'));\nsetImmediate(() => console.log('4 setImmediate'));\nsetTimeout(() => console.log('5 setTimeout'), 0);\nconsole.log('1 sync');\n\n// Output: 1, 2, 3, 4, 5\n// 1: synchronous\n// 2: nextTick — runs before any other queue\n// 3: Promise microtask — runs after nextTick\n// 4: setImmediate — check phase\n// 5: setTimeout — timers phase (0ms still has overhead)"
        },
        {
          theory: "A well-designed REST API uses nouns as resources (/users, /tweets), HTTP methods to express intent (GET to read, POST to create, PUT/PATCH to update, DELETE to remove), and standard status codes (200 OK, 201 Created, 204 No Content, 400 Bad Request, 404 Not Found). For feeds with frequently changing content, cursor-based pagination is more reliable than offset/limit — offset breaks when new items are inserted at the top (items shift position).",
          example: "GET /v1/tweets is like 'show me all tweets'. POST /v1/tweets is 'create a new tweet'. DELETE /v1/tweets/123 is 'delete tweet 123'. The cursor in pagination is like a bookmark — 'give me tweets after this one' — so even if new tweets appear, your place in the list doesn't change.",
          code: "// Clean REST API design\nGET    /v1/users/:id           → 200 { user }     (read)\nPOST   /v1/users              → 201 { user }     (create)\nPATCH  /v1/users/:id          → 200 { user }     (partial update)\nDELETE /v1/users/:id          → 204             (delete, no body)\n\nGET    /v1/users/:id/tweets   → 200 { tweets, nextCursor }\n//     ?cursor=eyJpZCI6MTIzfQ==  (cursor-based pagination)\n\nPOST   /v1/users/:id/follow   → 204             (action as sub-resource)\n\n// Cursor pagination (stable under inserts)\n// Offset pagination BREAKS: if tweet is inserted at top,\n// all tweets shift down by 1 — user sees duplicates or skips a tweet"
        },
        {
          theory: "localStorage is accessible to any JavaScript on your page — including injected scripts from XSS attacks. If an attacker injects a script, they can read your JWT from localStorage and take it to another machine to impersonate the user. An httpOnly cookie cannot be read by JavaScript at all — even an injected script can't see it. However cookies are automatically sent with every request, which creates CSRF risk (an attacker can trick the user's browser into sending a request to your server). The defence against CSRF with cookies is SameSite=Strict (only sends on same-site requests) and/or a CSRF token.",
          example: "localStorage is like leaving your house key under the doormat — any visitor who knows to look there (injected script) can take it. An httpOnly cookie is like a key that's physically sewn into your clothing — you use it to get in, but someone watching you can't grab it.",
          code: "// INSECURE — XSS can steal token from localStorage\nlocalStorage.setItem('token', jwtToken);\n// Attacker's injected script: document.cookie reads nothing,\n// but localStorage.getItem('token') gets the JWT!\n\n// SECURE — httpOnly cookie (set on server)\n// Server response header:\nSet-Cookie: token=eyJ...; HttpOnly; Secure; SameSite=Strict; Path=/\n\n// HttpOnly: JS cannot read this cookie at all\n// Secure: only sent over HTTPS\n// SameSite=Strict: only sent on requests from your own site (blocks CSRF)\n\n// Client-side fetch still sends the cookie automatically:\nfetch('/api/me', { credentials: 'include' });"
        },
        {
          theory: "The N+1 problem is when you make 1 query to get N items, then N more queries to get related data for each item — N+1 total queries. For example: fetch 10 posts (1 query), then fetch the author for each post (10 queries) = 11 total. DataLoader solves this by batching: instead of executing each author fetch immediately, it collects all author IDs requested within a single event loop tick, then makes one database query for all of them at once, then distributes the results back to each waiting resolver.",
          example: "Without DataLoader: a waiter asks the kitchen for each diner's meal one at a time — 10 trips to the kitchen. With DataLoader: the waiter collects all 10 orders first, takes one trip to the kitchen with all 10 orders, and brings everything back at once.",
          code: "// N+1 Problem — BAD\nconst resolvers = {\n  Query: {\n    posts: () => db.query('SELECT * FROM posts'), // 1 query\n  },\n  Post: {\n    author: (post) => db.query( // called N times!\n      'SELECT * FROM users WHERE id = ?', [post.authorId]\n    )\n  }\n};\n// Fetching 10 posts = 1 + 10 = 11 queries\n\n// With DataLoader — GOOD\nconst userLoader = new DataLoader(async (ids) => {\n  // Called ONCE per event loop tick with all collected IDs\n  const users = await db.query(\n    'SELECT * FROM users WHERE id IN (?)', [ids]\n  );\n  return ids.map(id => users.find(u => u.id === id));\n});\n\nPost: {\n  author: (post) => userLoader.load(post.authorId) // batched!\n}\n// Result: 1 + 1 = 2 queries regardless of how many posts"
        },
        {
          theory: "Node.js uses libuv under the hood to delegate I/O operations (network requests, file reads, DNS lookups) to the OS. The OS handles these asynchronously. When they complete, the OS notifies libuv, which puts the callback on the event queue. The single JavaScript thread is free the entire time — it never sits there waiting. The thing that blocks Node's single thread is CPU-heavy synchronous work: large JSON.parse(), complex sorting, image processing, cryptography. These prevent the event loop from handling other requests.",
          example: "Node is like a restaurant manager who takes orders (accepts requests) and sends them to the kitchen (OS/libuv). The manager doesn't stand in the kitchen waiting — they keep taking new orders. But if the manager starts cooking themselves (CPU-heavy JS code), they can't take orders for as long as they're cooking.",
          code: "// NODE HANDLES THIS FINE — I/O is async, JS thread stays free\napp.get('/users', async (req, res) => {\n  const users = await db.query('SELECT * FROM users'); // async I/O\n  // JS thread is FREE while DB query runs\n  res.json(users);\n});\n// Can handle 10,000 concurrent requests this way\n\n// THIS BLOCKS THE EVENT LOOP — bad for concurrency\napp.get('/compute', (req, res) => {\n  const result = hugeJsonString.split('').sort().join(''); // sync CPU work\n  // ALL OTHER REQUESTS WAIT while this runs\n  res.send(result);\n});\n\n// FIX: offload CPU work to a Worker Thread\nconst { Worker } = require('worker_threads');\nconst worker = new Worker('./compute-worker.js', { workerData: input });\nworker.on('message', result => res.send(result));"
        }

        {
          theory: "To diagnose LCP: run Lighthouse to identify what the LCP element actually is (it's often the hero image or main heading). Then check each part of the chain: TTFB (server response time) — if over 600ms, add a CDN or caching. Then check if the LCP resource is discovered early — if the hero image is in CSS background or loaded by JS, the browser finds it late. Add a preload link tag to discover it immediately. Check for render-blocking CSS/JS in the head — inline critical CSS. Finally check the image itself: is it the right format and size?",
          example: "LCP is like timing how long a restaurant takes from when you sit down to when food arrives. You diagnose the bottleneck step by step: Was the menu late? (TTFB) Was the waiter slow to take your order? (late resource discovery) Was the kitchen backed up with other things? (render-blocking resources) Was the meal too complex to prepare? (oversized image).",
          code: "<!-- Step 1: Preload the LCP image — browser discovers it immediately -->\n<link rel=\"preload\" as=\"image\" href=\"/hero.jpg\" fetchpriority=\"high\">\n\n<!-- Step 2: Priority hint on the image element -->\n<img src=\"/hero.jpg\" fetchpriority=\"high\" alt=\"Hero\">\n\n<!-- Step 3: Inline critical CSS to unblock first paint -->\n<style>\n  /* Only above-the-fold styles */\n  body { margin: 0; font-family: sans-serif; }\n  .hero { height: 500px; background: #f0f0f0; }\n</style>\n\n<!-- Step 4: Defer all non-critical CSS -->\n<link rel=\"stylesheet\" href=\"/full.css\" media=\"print\"\n      onload=\"this.media='all'\">\n\n<!-- Step 5: Serve modern formats (saves 30-50% size) -->\n<picture>\n  <source srcset=\"hero.avif\" type=\"image/avif\">\n  <source srcset=\"hero.webp\" type=\"image/webp\">\n  <img src=\"hero.jpg\" alt=\"Hero\" fetchpriority=\"high\">\n</picture>"
        },
        {
          theory: "React.lazy() takes a function that calls dynamic import() and returns a 'lazy' component. When React tries to render it for the first time, it starts loading the chunk. The Suspense boundary above it catches the loading state and shows the fallback (usually a spinner) until the chunk is ready. This means users only download the code for pages they actually visit — the initial bundle is much smaller.",
          example: "Instead of downloading a 2MB app bundle upfront, each route's code is a separate file. Opening the home page downloads just the home page code. Clicking to the settings page downloads settings code at that moment — just-in-time. It's like streaming a film instead of waiting for a full download before playing.",
          code: "import { lazy, Suspense } from 'react';\nimport { BrowserRouter, Routes, Route } from 'react-router-dom';\n\n// These chunks are downloaded on-demand, NOT in the initial bundle\nconst Home     = lazy(() => import('./pages/Home'));\nconst Settings = lazy(() => import('./pages/Settings'));\nconst Profile  = lazy(() => import('./pages/Profile'));\n\nfunction App() {\n  return (\n    <BrowserRouter>\n      <Suspense fallback={<div className=\"spinner\">Loading...</div>}>\n        <Routes>\n          <Route path=\"/\"        element={<Home />} />\n          <Route path=\"/settings\" element={<Settings />} />\n          <Route path=\"/profile\"  element={<Profile />} />\n        </Routes>\n      </Suspense>\n    </BrowserRouter>\n  );\n}\n\n// Preload a route on hover — chunk is ready before user clicks\nfunction NavLink({ to, page: Page, label }) {\n  return (\n    <a href={to} onMouseEnter={() => import(`./pages/${label}`)}>\n      {label}\n    </a>\n  );\n}"
        },
        {
          theory: "CSR (Client-Side Rendering) sends an empty HTML shell; the browser downloads and runs JavaScript to build the page. Fast interactions but slow initial load and bad SEO. SSG (Static Site Generation) pre-builds all HTML files at deploy time — blazing fast, great SEO, but content is stale until you redeploy. SSR (Server-Side Rendering) builds HTML fresh on every request on the server — always up to date, good SEO, but uses server resources. ISR (Incremental Static Regeneration) is SSG where pages can be refreshed after a set time without a full redeploy.",
          example: "CSR is like a flat-pack kitchen that assembles itself after delivery — takes time on arrival but you can rearrange it. SSG is like a pre-built kitchen delivered ready to install. SSR is like a custom kitchen built to order every time. ISR is pre-built, but you can order a fresh one every 24 hours automatically.",
          code: "// Next.js — choosing the right strategy per page\n\n// SSG — content doesn't change often (blog post)\nexport async function generateStaticParams() {\n  return posts.map(p => ({ slug: p.slug }));\n}\n\n// ISR — regenerate every 60 seconds (product page)\nexport const revalidate = 60;\nexport default async function ProductPage({ params }) {\n  const product = await fetchProduct(params.id);\n  return <Product data={product} />;\n}\n\n// SSR — personalised per request (user feed)\nexport const dynamic = 'force-dynamic';\nexport default async function FeedPage() {\n  const user = await getUser(); // reads cookies/session\n  const feed = await getUserFeed(user.id);\n  return <Feed items={feed} />;\n}\n\n// CSR — dashboard behind auth (no SEO needed)\n'use client';\nexport default function Dashboard() {\n  const { data } = useQuery(['dashboard'], fetchDashboard);\n  return <DashboardUI data={data} />;\n}"
        },
        {
          theory: "300ms re-renders on every keystroke means something expensive is happening in the render cycle. Use React DevTools Profiler to record what happens: it shows each component's render time. Common causes: a large list rendering without React.memo, an expensive calculation without useMemo, a function recreated without useCallback causing memoized children to re-render, or a Context value that's a new object every render, causing all consumers to update.",
          example: "Imagine a 100-person team where the manager (parent component) shouts an update every time anyone types. Without React.memo, all 100 people (child components) turn around and respond even if the message doesn't affect them. With proper memoization, only the ones who care about that specific message respond.",
          code: "// Step 1: Open React DevTools → Profiler → Record\n// Type a key → Stop recording\n// Look for: which component has the longest bar?\n\n// Fix 1: Wrap expensive list component with React.memo\nconst ExpensiveList = React.memo(({ items }) => {\n  return items.map(i => <ListItem key={i.id} item={i} />);\n});\n\n// Fix 2: Memoize expensive computation\nconst sortedItems = useMemo(\n  () => items.sort((a, b) => a.name.localeCompare(b.name)),\n  [items] // only re-sorts when items array changes\n);\n\n// Fix 3: Stable callback reference for child components\nconst handleSelect = useCallback((id) => {\n  setSelected(id);\n}, []); // no deps → same reference always\n\n// Fix 4: Memoize Context value to prevent all consumers re-rendering\nconst contextValue = useMemo(\n  () => ({ user, theme, locale }),\n  [user, theme, locale]\n);"
        },
        {
          theory: "stale-while-revalidate is a caching strategy where the browser serves a cached (possibly slightly old) response immediately, and then fetches a fresh version in the background for next time. The user gets an instant response (because cache is always served first), and the data is kept up to date in the background. The trade-off is that the data might be up to N seconds old on any given request — acceptable for many use cases like product listings, news articles, or weather data.",
          example: "Think of a newspaper subscription. Every morning you get yesterday's paper immediately (no wait — stale but instant). Meanwhile, the delivery service collects the new one and drops it off for tomorrow. You're always reading fast, and the information lag is just one day.",
          code: "// Server-side Cache-Control header\n// Serve cached response for 60s, allow stale for 1 hour while revalidating\nres.setHeader(\n  'Cache-Control',\n  'max-age=60, stale-while-revalidate=3600'\n);\n\n// What this means:\n// 0-60 seconds after caching: serve fresh cache (no network request)\n// 60-3660 seconds: serve stale cache INSTANTLY, revalidate in background\n// After 3660 seconds: must wait for fresh response\n\n// SWR library uses the same concept for API calls:\nimport useSWR from 'swr';\nfunction Profile() {\n  const { data } = useSWR('/api/user', fetcher, {\n    // Show stale data instantly, then update silently in background\n    revalidateOnFocus: true,\n    dedupingInterval: 2000\n  });\n  return <div>{data?.name ?? 'Loading...'}</div>;\n}"
        }
