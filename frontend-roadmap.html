<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>Frontend Engineer Roadmap — FAANG Prep</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-main: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f1f0ec;
      --border: rgba(0, 0, 0, 0.1);
      --border2: rgba(0, 0, 0, 0.18);
      --text: #1a1a18;
      --text2: #5f5e5a;
      --text3: #888780;

      --pastel-yellow: #ffeab6;
      --pastel-mint: #dcf0eb;
      --pastel-purple: #e6daff;
      --pastel-pink: #ffd6e8;

      --accent-black: #000000;
      --accent-white: #ffffff;

      --radius: 24px;
      --radius-sm: 16px;
      --radius-pill: 9999px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);

      --font-sans: 'Outfit', 'Inter', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Keep light theme structure mostly, or disable dark mode for this specific pastel vibe */
        --bg-main: #f0f2f5;
        --surface: #ffffff;
        --surface2: #f1f0ec;
        --border: rgba(0, 0, 0, 0.1);
        --border2: rgba(0, 0, 0, 0.18);
        --text: #1a1a18;
        --text2: #5f5e5a;
        --text3: #888780;
      }
    }

    html {
      background-color: var(--bg-main);
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .cover {
      background: var(--bg-main);
      color: var(--text);
      padding: 4rem 2.5rem 2rem;
      position: relative;
      text-align: left;
    }

    .cover-subtitle {
      font-size: 14px;
      letter-spacing: 0.05em;
      color: var(--text2);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .cover-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .cover-name {
      font-size: 16px;
      color: var(--text2);
      font-weight: 500;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-faang {
      background: #EEEDFE;
      color: #3C3489;
      font-size: 14px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .stat-val {
      font-size: 36px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .progress-track {
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      margin-bottom: 0.75rem;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--text);
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-label {
      font-size: 13px;
      color: var(--text2);
      font-weight: 500;
    }

    .streak-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFE8A1;
      padding: 8px 16px;
      border-radius: 100px;
      margin-top: 1.5rem;
    }

    .streak-flame {
      font-size: 18px;
    }

    .streak-text {
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }

    .today-box {
      background: #E1F5EE;
      padding: 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      margin-inline: 16px;
    }

    .today-label {
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    .today-text {
      font-size: 16px;
      color: var(--text);
      line-height: 1.5;
      font-weight: 500;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text2);
      font-weight: 500;
    }

    .stat-label span {
      font-size: 11px;
      color: var(--text3);
      font-weight: 400;
    }

    .phases {
      padding: 24px 16px;
      /* max-width: 860px; */
      margin: 0 auto;
    }

    .phase-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .phase-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .phase-header:hover {
      background: var(--surface2);
    }

    .phase-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .phase-info {
      flex: 1;
      min-width: 0;
    }

    .phase-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }

    .phase-subtitle {
      font-size: 13px;
      color: var(--text3);
      margin-top: 2px;
    }

    .phase-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .phase-progress-ring {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .phase-progress-ring svg {
      transform: rotate(-90deg);
    }

    .ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text2);
    }

    .chevron {
      font-size: 14px;
      color: var(--text3);
      transition: transform 0.2s;
    }

    .phase-card.open .chevron {
      transform: rotate(180deg);
    }

    .phase-phase-bar {
      height: 3px;
      background: var(--surface2);
      margin: 0 18px;
    }

    .phase-phase-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.4s ease;
    }

    .topics {
      display: none;
      padding: 16px 18px 20px;
    }

    .phase-card.open .topics {
      display: block;
    }

    .topic-section {
      margin-bottom: 18px;
    }

    .topic-section:last-child {
      margin-bottom: 0;
    }

    .topic-section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 8px;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 6px;
    }

    .topic-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      transition: background 0.12s, border-color 0.12s;
    }

    .topic-item:hover {
      background: var(--surface2);
      border-color: var(--border2);
    }

    .topic-item.done {
      background: var(--pastel-mint);
      border-color: var(--border2);
    }



    .topic-check {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--border2);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .topic-item.done .topic-check {
      background: var(--accent-black);
      border-color: var(--accent-black);
    }

    .topic-check svg {
      display: none;
    }

    .topic-item.done .topic-check svg {
      display: block;
    }

    .topic-item.in-progress {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
    }

    .topic-item.in-progress .topic-check {
      background: #f59e0b;
      border-color: #f59e0b;
      position: relative;
    }

    .topic-item.in-progress .topic-check svg {
      display: none;
    }

    .topic-item.in-progress .topic-check::after {
      content: '…';
      color: white;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
    }

    .topic-body {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .topic-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .topic-desc {
      font-size: 13px;
      color: var(--text3);
      margin-top: 2px;
      line-height: 1.4;
    }

    .topic-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .faang-tag {
      font-size: 11px;
      font-weight: 600;
      background: #FAEEDA;
      color: #854F0B;
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    @media (prefers-color-scheme: dark) {
      .faang-tag {
        background: #412402;
        color: #FAC775;
      }
    }

    .info-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text3);
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      line-height: 1;
      flex-shrink: 0;
    }

    .info-btn:hover {
      background: #EEEDFE;
      border-color: var(--accent-black);
      color: var(--accent-black);
    }

    @media (prefers-color-scheme: dark) {
      .info-btn:hover {
        background: #26215C;
        border-color: #7F77DD;
        color: #AFA9EC;
      }
    }

    .resources-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 12px 18px 16px;
      border-top: 0.5px solid var(--border);
    }

    .resource-link {
      font-size: 13px;
      color: var(--accent-black);
      padding: 4px 10px;
      border: 0.5px solid #c9c5f5;
      border-radius: 20px;
      text-decoration: none;
      transition: background 0.12s;
    }

    .resource-link:hover {
      background: #EEEDFE;
    }

    @media (prefers-color-scheme: dark) {
      .resource-link {
        color: #AFA9EC;
        border-color: #3C3489;
      }

      .resource-link:hover {
        background: #26215C;
      }
    }

    .tip-bar {
      background: #E6F1FB;
      color: #0C447C;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
    }

    @media (prefers-color-scheme: dark) {
      .tip-bar {
        background: #042C53;
        color: #85B7EB;
      }
    }

    .reset-btn {
      display: block;
      margin: 0 auto;
      font-size: 12px;
      color: var(--text3);
      background: none;
      border: 0.5px solid var(--border2);
      border-radius: 20px;
      padding: 6px 16px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .reset-btn:hover {
      color: #c0392b;
      border-color: #c0392b;
    }

    /* ── Sidebar ── */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 100vw);
      background: var(--surface);
      border-left: 0.5px solid var(--border2);
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      padding: 18px 20px 14px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex-shrink: 0;
    }

    .sidebar-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .sidebar-title-wrap {
      flex: 1;
    }

    .sidebar-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .sidebar-phase {
      font-size: 13px;
      color: var(--text3);
      margin-top: 3px;
    }

    .sidebar-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 0.5px solid var(--border2);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.12s;
    }

    .sidebar-close:hover {
      background: var(--surface2);
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .info-block {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .info-block-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-block-label span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      font-size: 10px;
    }

    .info-block-text {
      font-size: 15px;
      color: var(--text2);
      line-height: 1.65;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .key-points {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .key-point {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 14px;
      color: var(--text2);
      line-height: 1.5;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
    }

    .key-point-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-black);
      flex-shrink: 0;
      margin-top: 5px;
    }

    .sidebar-faang-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FAEEDA;
      color: #633806;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      align-self: flex-start;
    }

    @media (prefers-color-scheme: dark) {
      .sidebar-faang-badge {
        background: #412402;
        color: #FAC775;
      }
    }

    .sidebar-done-btn {
      margin-top: auto;
      padding: 20px 20px 24px;
      border-top: 0.5px solid var(--border);
      flex-shrink: 0;
    }

    .mark-done-btn {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius-sm);
      border: 1.5px solid #534AB7;
      background: none;
      color: var(--accent-black);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .mark-done-btn:hover {
      background: var(--accent-black);
      color: #fff;
    }

    .mark-done-btn.already-done {
      background: var(--accent-black);
      color: #fff;
    }

    .mark-done-btn.already-done:hover {
      background: #333;
    }

    /* ── Two-column phase layout ── */
    .phase-body-grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 0;
      align-items: start;
    }

    @media (max-width: 700px) {
      .phase-body-grid {
        grid-template-columns: 1fr;
      }
    }

    .topics-col {
      min-width: 0;
      padding-right: 16px;
    }

    .questions-col {
      border-left: 0.5px solid var(--border);
      padding-left: 16px;
    }

    .questions-col-hdr {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
      padding-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .questions-col-hdr span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface2);
      font-size: 10px;
      color: var(--text3);
    }

    .q-item {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .q-item-hdr {
      padding: 9px 11px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background 0.12s;
      user-select: none;
    }

    .q-item-hdr:hover {
      background: var(--surface2);
    }

    .q-num {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      min-width: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .q-text {
      font-size: 12px;
      color: var(--text);
      line-height: 1.45;
      flex: 1;
    }

    .q-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .q-diff {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .q-diff.hard {
      background: #FCEBEB;
      color: #A32D2D;
    }

    .q-diff.med {
      background: #FAEEDA;
      color: #854F0B;
    }

    @media (prefers-color-scheme: dark) {
      .q-diff.hard {
        background: #501313;
        color: #F09595;
      }

      .q-diff.med {
        background: #412402;
        color: #FAC775;
      }
    }

    .q-co {
      font-size: 9px;
      color: var(--text3);
      padding: 2px 5px;
      border-radius: 3px;
      border: 0.5px solid var(--border);
      white-space: nowrap;
    }

    .q-chevron {
      font-size: 10px;
      color: var(--text3);
      transition: transform 0.15s;
      flex-shrink: 0;
      margin-top: 3px;
      line-height: 1;
    }

    .q-item.open .q-chevron {
      transform: rotate(180deg);
    }

    .q-hint {
      display: none;
      padding: 9px 12px 11px;
      border-top: 0.5px solid var(--border);
      font-size: 11.5px;
      color: var(--text2);
      line-height: 1.65;
      background: var(--surface2);
    }

    .q-item.open .q-hint {
      display: block;
    }

    .q-hint-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-black);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Q&A Open Button (phase header) ── */
    .qa-open-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 0.5px solid var(--border2);
      background: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qa-open-btn:hover {
      background: #EEEDFE;
      border-color: var(--accent-black);
      color: var(--accent-black);
    }

    @media (prefers-color-scheme: dark) {
      .qa-open-btn:hover {
        background: #26215C;
        border-color: #7F77DD;
        color: #AFA9EC;
      }
    }

    /* ── Q&A Full-Answer Modal ── */
    .qa-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 200;
      opacity: 0;

  <script>
    const TOPIC_INFO = {
      j11: { what: "Polyfills are fallback implementations of modern features. Writing them from scratch (like Promise.all or Array.prototype.reduce) tests your deep understanding of JS internals.", why: "FAANG (especially Meta) heavily asks candidates to implement native methods. It proves you understand how the language works under the hood.", points: ["Promise.all: return new Promise, track resolved count, resolve when count === length", "reduce: initialize accumulator, handle optional initialValue, loop and apply callback", "bind: return a closure that calls the original fn using apply() with the bound 'this'", "It's not just about making it work; handle edge cases like empty arrays or non-functions"] },
      j12: { what: "A deep clone creates a fully independent copy of an object, including all nested objects, unlike the spread operator (...obj) which only does a shallow copy.", why: "Writing a deep clone function is a classic interview question. It tests recursion, type checking, and handling edge cases like circular references.", points: ["structuredClone() is the modern native way, but interviewers want you to write it", "Use a WeakMap to track already-copied objects to prevent infinite loops on circular refs", "Handle special object types: Date, RegExp, Map, Set", "Check typeof obj !== 'object' or obj === null for base cases"] },
      r7: { what: "Custom hooks encapsulate reusable stateful logic. Interviewers often ask you to implement standard utility hooks like usePrevious, useDebounce, or useThrottle from scratch.", why: "It demonstrates advanced React knowledge, particularly the interaction between useEffect, useRef, and closures.", points: ["usePrevious: store current value in a ref inside useEffect; return the ref (which holds the previous value during render)", "useDebounce: use useEffect to set a timeout that updates state, return the debounced state, clear timeout on cleanup", "useLocalStorage: initialize state lazily reading from localStorage, update localStorage in useEffect", "Test your hooks mentally: what happens on re-render? What if dependencies change?"] },
      r8: { what: "The Virtual DOM is a lightweight JS representation of the real DOM. Reconciliation is the process of diffing the old VDOM with the new one to calculate minimal DOM updates.", why: "FAANG expects senior React devs to understand React's rendering engine (Fiber), why it's fast, and how to optimize it.", points: ["Fiber architecture allows React to pause, resume, or abort rendering work (Concurrent React)", "Diffing heuristic: elements of different types tear down the whole tree", "Keys: React uses keys to match children in lists; using index as key breaks state if the list order changes", "Real DOM updates are batched and applied in the 'commit' phase"] },
      adv8: { what: "Event delegation is attaching a single event listener to a parent element to handle events for multiple children, utilizing event bubbling.", why: "Attaching 1000 listeners to 1000 list items consumes massive memory. Attaching 1 listener to the <ul> is highly performant. A mandatory topic for vanilla JS interviews.", points: ["Event flow: Capture phase (down) -> Target -> Bubble phase (up)", "e.target is the element clicked; e.currentTarget is the element with the listener", "Use e.target.closest('.item') to find the exact child element that triggered the event", "e.stopPropagation() stops bubbling; e.preventDefault() stops default browser behavior"] },
      mc1: { what: "Building an Autocomplete/Typeahead component involves an input field that fetches and displays suggestions as the user types.", why: "This is the #1 most common Machine Coding question at FAANG. It touches network, performance, UI, and accessibility.", points: ["Debounce the API call to avoid spamming the server on every keystroke", "Implement a cache (Map or object) to store results for previously typed queries", "Keyboard navigation is crucial: Up/Down arrows to highlight, Enter to select", "Handle race conditions: if a slow request resolves after a fast one, ignore the slow one"] },
      mc2: { what: "An image carousel (or slider) displays a series of images, allowing the user to navigate through them via buttons or swipe gestures.", why: "Tests CSS layout skills, state management, and handling animations/transitions efficiently without layout thrashing.", points: ["Use Flexbox for a horizontal row of images and overflow: hidden on the container", "Use CSS transform: translateX() instead of left/margin for 60fps animations", "For infinite looping, clone the first and last images and jump seamlessly when reaching the end", "Handle touch events (touchstart, touchmove, touchend) for mobile swiping"] },
      mc3: { what: "A star rating widget lets users select a rating from 1 to 5 stars, often supporting hover states and half-stars.", why: "A frequent warm-up UI coding question. Tests DOM manipulation, event handling, and CSS styling (like filling stars partially).", points: ["Use event delegation on the container for mouseover, mouseout, and click", "Visual state vs persisted state: hover changes visual state temporarily, click locks it in", "Accessibility: use radio buttons under the hood, or aria-valuemax / aria-valuenow", "For half-stars, calculate the mouse position relative to the star element's width"] },

      // HTML
      h1: { what: "Semantic HTML means using the right HTML element for the right purpose — <header>, <nav>, <main>, <section>, <article>, <aside>, <footer>.", why: "Search engines and screen readers rely on semantic structure to understand your page. Google gives ranking weight to properly structured pages, and FAANG accessibility bars require semantic markup for compliance.", points: ["Always prefer <button> over <div> for clickable elements", "Use <h1>–<h6> in order without skipping levels", "<article> is self-contained, <section> groups related content", "<nav> wraps primary navigation links only"] },
      h2: { what: "HTML forms with native validation, input types (email, number, date, range), and the Constraint Validation API for custom error messages.", why: "Forms are the core of every product — signup, checkout, search. FAANG interviews often include form accessibility and usability challenges. Native validation is faster and more accessible than JS-only approaches.", points: ["Use type='email' so mobile shows the right keyboard", "pattern attribute + setCustomValidity() for custom rules", "<fieldset> + <legend> for grouped inputs (radio, checkbox)", "novalidate on form + manual check gives full control"] },
      h3: { what: "Elements for embedding images, video, audio with responsive techniques like srcset, sizes, and the <picture> element for art direction.", why: "Media is 60–80% of most pages' bytes. Knowing how to serve the right image at the right size is a core performance skill asked at FAANG.", points: ["srcset lists available image widths for the browser to choose", "sizes tells the browser how wide the image will render", "<picture> lets you serve WebP with a JPEG fallback", "loading='lazy' defers off-screen images automatically"] },
      h4: { what: "The <head> tags that help search engines understand your page — <title>, meta description, Open Graph tags for social sharing, and canonical URLs.", why: "SEO impacts product discoverability. Senior FE engineers are expected to understand how their markup affects search ranking and social previews.", points: ["<title> is the single most important on-page SEO element", "og:title / og:image control how links look on Twitter/Slack", "canonical tag prevents duplicate content penalties", "robots meta tag controls indexing per page"] },
      // CSS
      c1: { what: "Flexbox is a one-dimensional CSS layout model for distributing space along a row or column.", why: "Flexbox is the daily workhorse of modern UI layouts. Every FAANG UI team uses it. Mastering it means no more float hacks or table layouts.", points: ["justify-content controls alignment on the main axis", "align-items / align-self control cross-axis alignment", "flex-grow: 1 lets an item absorb available space", "flex-wrap: wrap enables responsive wrapping without media queries"] },
      c2: { what: "CSS Grid is a two-dimensional layout system — you control both rows and columns simultaneously.", why: "Complex dashboards, card grids, and magazine layouts all need Grid. It's the most powerful layout tool in CSS and expected knowledge at senior level.", points: ["grid-template-areas gives layouts a visual ASCII-art map", "auto-fill + minmax creates responsive columns with zero JS", "subgrid lets children align to the parent grid", "fr unit distributes space proportionally"] },
      c3: { what: "Building UIs that work across all screen sizes using media queries, fluid typography, and modern container queries.", why: "Every FAANG product must work on mobile, tablet, and desktop. Responsive design is non-negotiable and tested in UI coding rounds.", points: ["Mobile-first: write base styles for small, override for large", "Container queries respond to the component's own width, not viewport", "clamp(min, preferred, max) creates fluid type without breakpoints", "min(), max(), clamp() are now the preferred fluid sizing tools"] },
      c4: { what: "CSS custom properties (variables) declared with -- prefix, used to build design token systems and automatic light/dark theming.", why: "Every modern design system (Google, Meta, Airbnb) uses CSS variables for theming. They're runtime-changeable, unlike SCSS variables, making them ideal for user preferences.", points: ["Declare tokens at :root for global scope", "var(--color-primary, fallback) for safe usage", "JS can read/write CSS vars: el.style.setProperty('--x', val)", "@media (prefers-color-scheme: dark) swaps the token values"] },
      c5: { what: "CSS transitions for simple A→B changes and @keyframes animations for multi-step sequences. The will-change hint and prefers-reduced-motion media query.", why: "Smooth animations increase perceived performance and delight. FAANG products are polished — janky animations are a red flag in UI reviews. Accessibility compliance requires respecting reduced-motion preferences.", points: ["transition: property duration easing — only specify what changes", "will-change: transform tells the browser to create a GPU layer", "prefers-reduced-motion: reduce — always honour this", "transform + opacity animate on GPU; avoid animating layout props"] },
      c6: { what: "Methodologies for writing scalable, maintainable CSS: BEM (Block-Element-Modifier) naming, SMACSS architecture, and utility-first with Tailwind.", why: "CSS at FAANG scale (thousands of components) requires a naming system to prevent style collisions. Large codebases with no system become unmaintainable fast.", points: ["BEM: .card__title--highlighted is clear and conflict-free", "Tailwind utility classes eliminate dead CSS — only used classes ship", "CSS Modules scope class names to the component file automatically", "Avoid deeply nested selectors — specificity wars waste hours"] },
      // a11y
      a1: { what: "WCAG 2.1 is the international standard for web accessibility with three levels: A (minimum), AA (legal target), AAA (enhanced). Built on four principles: Perceivable, Operable, Understandable, Robust.", why: "All FAANG companies are legally required to meet WCAG 2.1 AA. Accessibility failures are ADA lawsuit risks. It also makes products usable for the 1 billion people with disabilities worldwide.", points: ["1.4.3 Contrast: text must be 4.5:1 against background", "2.4.7 Focus visible: interactive elements must show focus ring", "1.1.1 Non-text content: images need alt text", "2.1.1 Keyboard: all functionality must work without a mouse"] },
      a2: { what: "ARIA (Accessible Rich Internet Applications) provides semantic meaning to non-native HTML elements through role, aria-label, aria-describedby, aria-expanded, aria-live, etc.", why: "When you build custom components (dropdowns, modals, tabs) out of <div>s, screen readers see nothing. ARIA bridges this gap. FAANG interviews test whether you know how to make custom widgets accessible.", points: ["Rule #1: No ARIA is better than bad ARIA — use native HTML first", "aria-label overrides visible text for screen readers", "aria-live='polite' announces dynamic changes like toast messages", "aria-expanded tells screen readers if a menu is open or closed"] },
      a3: { what: "Ensuring all interactive elements are reachable and operable via keyboard alone — Tab, Shift+Tab, Enter, Space, arrow keys, and Escape.", why: "Millions of users with motor disabilities navigate by keyboard. FAANG keyboard testing is standard. Getting this wrong blocks users and creates legal liability.", points: ["tabindex='0' adds element to natural tab order; '-1' removes it", "Modals must trap focus inside and return it on close", "Skip navigation links let keyboard users jump past repeated nav", "Arrow keys navigate within a widget (menu, tabs, tree)"] },
      a4: { what: "Testing with real screen readers (VoiceOver on Mac/iOS, NVDA on Windows) and automated tools (axe DevTools, Lighthouse accessibility audit).", why: "Automated tools only catch ~30% of accessibility issues. Real screen reader testing finds the rest. FAANG teams have dedicated a11y engineers who catch issues before shipping.", points: ["VoiceOver: Cmd+F5 to start, VO+arrow keys to navigate", "axe DevTools Chrome extension finds violations instantly", "Lighthouse a11y score is a quick first check in CI", "Keyboard-only navigation is the fastest manual test you can do"] },
      // JS
      j1: { what: "Closures are functions that remember the variables from their outer scope even after that scope has finished executing. Lexical scope means a function's scope is determined by where it's written, not where it's called.", why: "Closures power almost every JavaScript pattern — modules, callbacks, event handlers, memoisation, partial application. FAANG interviewers use closures to test deep JS understanding.", points: ["A closure is created every time a function is defined inside another", "Classic gotcha: var in a loop captures the loop variable by reference", "Module pattern uses IIFE + closure to create private state", "Counter factories, memoize(), and debounce all rely on closures"] },
      j2: { what: "Every JavaScript object has an internal [[Prototype]] link forming a chain. ES6 class syntax is syntactic sugar over this prototype system.", why: "Understanding prototypes is essential for debugging inheritance bugs, building frameworks, and answering 'How does JavaScript work?' questions at FAANG.", points: ["Object.create(proto) sets the prototype explicitly", "class extends translates to prototype chain under the hood", "hasOwnProperty() distinguishes own props from inherited ones", "instanceof walks the prototype chain to check ancestry"] },
      j3: { what: "'this' refers to the object a function is called on. Its value depends on call-site context, not where the function is defined. call/apply/bind let you control it explicitly.", why: "Confusing 'this' is one of the most common JS interview traps. FAANG interviewers test it to verify you truly understand the language.", points: ["Arrow functions don't have their own 'this' — they inherit from lexical scope", "In strict mode, 'this' in a regular function is undefined, not window", "bind() returns a new function with 'this' permanently fixed", "setTimeout callback loses 'this' unless arrow fn or .bind(this)"] },
      j4: { what: "JavaScript is single-threaded with a call stack. The event loop moves tasks from the callback queue to the stack when it's empty. Microtasks (Promises, queueMicrotask) run before macrotasks (setTimeout).", why: "Understanding the event loop is the #1 most-asked JavaScript internals question at FAANG. It explains why UI freezes, why async code ordering matters, and how to write non-blocking code.", points: ["Microtask queue (Promises) drains completely before next macrotask", "setTimeout(fn, 0) doesn't mean 'immediately' — call stack must empty first", "Long synchronous loops block the UI — break with chunking or workers", "requestAnimationFrame runs before the next repaint, not in microtask queue"] },
      j5: { what: "Modern JavaScript syntax: destructuring assignment, spread/rest operators, optional chaining (?.), nullish coalescing (??), logical assignment (&&=, ||=, ??=), and more.", why: "These features are in every FAANG codebase. Using them correctly signals modern JS fluency. Optional chaining alone prevents thousands of 'cannot read property of undefined' errors.", points: ["const { a, b = 'default' } = obj — with fallback", "const [first, ...rest] = arr — rest collects remainder", "a?.b?.c returns undefined instead of throwing if a or b is null", "a ?? 'fallback' — only triggers for null/undefined, unlike || which also triggers for 0/''"] },
      j6: { what: "ES Modules (import/export) are the native browser module system. CommonJS (require/module.exports) is Node's original system. Dynamic import() loads modules on demand.", why: "Module systems determine how code is split, bundled, and loaded. Tree shaking (removing unused exports) only works with ESM. FAANG engineers must understand this for performance.", points: ["Named exports: export const fn = () => {} | import { fn }", "Default export: export default fn | import fn from './fn'", "Dynamic: const mod = await import('./heavy') — enables code splitting", "Circular imports cause subtle bugs — prefer one-directional dependency graphs"] },
      j7: { what: "Promises represent eventual completion (or failure) of async operations. Promise.all runs in parallel and waits for all. Promise.race returns the first to settle. Promise.allSettled waits for all regardless of failure.", why: "Async patterns are central to frontend work — fetching data, file reads, timers. FAANG interviews often include parallel request optimisation questions where allSettled vs all matters.", points: ["Promise.all rejects immediately if any promise rejects", "Promise.allSettled waits for all and tells you which failed", "Promise.race is useful for implementing timeouts", "Unhandled rejection crashes Node apps — always add .catch()"] },
      j8: { what: "async/await is syntactic sugar over Promises, making async code look and behave like synchronous code. Error handling uses standard try/catch.", why: "async/await is the standard pattern in every modern FAANG codebase. Interviewers test if you can write it correctly and understand its relationship to Promises.", points: ["await can only be used inside an async function", "try/catch wraps await for error handling", "For parallel execution: const [a,b] = await Promise.all([p1, p2])", "async functions always return a Promise, even if you return a plain value"] },
      j9: { what: "The fetch API makes HTTP requests from the browser. It returns a Promise. CORS (Cross-Origin Resource Sharing) controls which cross-origin requests are allowed.", why: "Almost every frontend application fetches data from an API. Understanding fetch deeply — including CORS errors, request headers, and error handling — is core FAANG frontend knowledge.", points: ["fetch only rejects on network failure, not on 4xx/5xx — check res.ok", "Always set Content-Type: application/json when sending JSON", "CORS errors are a server-side configuration issue, not a client bug", "AbortController lets you cancel in-flight requests"] },
      j10: { what: "WebSockets provide a persistent, full-duplex connection between client and server. Server-Sent Events (SSE) provide one-way server→client streaming over HTTP.", why: "Real-time features (chat, live dashboards, multiplayer) require persistent connections. FAANG system design rounds often involve designing real-time systems.", points: ["WebSocket: both sides can send messages at any time", "SSE is simpler for server push — uses regular HTTP, auto-reconnects", "Use Socket.io for WebSocket with automatic fallback to polling", "Heartbeat/ping messages prevent idle connections from being closed"] },
      // DSA
      d1: { what: "Two-pointer technique uses two indices moving through an array. Sliding window maintains a range of elements. Frequency map counts element occurrences with a hash map.", why: "These patterns appear in 30-40% of LC medium array/string problems asked at FAANG. Recognising the pattern instantly halves your solve time.", points: ["Two pointers: move from both ends toward center (reverse, pair sum)", "Sliding window: expand right, shrink left when condition breaks", "Frequency map: count chars with Map then compare — O(n) vs O(n²)", "Common problems: longest substring without repeat, valid anagram, two sum"] },
      d2: { what: "Singly/doubly linked lists with pointer manipulation. Fast/slow pointers detect cycles. Reversal in-place. Common operations: insert, delete, merge.", why: "Linked list problems are a FAANG coding staple — they test pointer manipulation and edge-case thinking without complex algorithms.", points: ["Fast pointer moves 2 steps, slow 1 step — they meet inside a cycle", "Reverse in-place: prev=null, curr=head, while curr: next=curr.next, curr.next=prev,...", "Dummy head node simplifies edge cases at the list start", "Always check for null before .next — most bugs here are NPEs"] },
      d3: { what: "Binary trees (each node ≤ 2 children), binary search trees (left < root < right), graphs (nodes + edges). DFS explores depth-first, BFS explores level-by-level.", why: "Tree and graph problems appear in ~40% of FAANG coding rounds. They test recursion, iterative thinking, and choosing the right traversal strategy.", points: ["DFS with recursion is elegant; DFS with stack avoids stack overflow on deep trees", "BFS with a queue finds shortest path in unweighted graphs", "Inorder traversal of BST gives sorted output", "Common: LCA, path sum, level-order traversal, number of islands"] },
      d4: { what: "DP breaks problems into overlapping subproblems and caches results. Top-down (memoisation) = recursion + cache. Bottom-up (tabulation) = iterative table fill.", why: "DP problems are the hardest LC category and appear in senior FAANG rounds. They test whether you can identify substructure and formalise a recurrence.", points: ["Identify: 'optimal substructure' + 'overlapping subproblems' = DP candidate", "Define state clearly: dp[i] means 'answer for first i elements'", "Common patterns: 0/1 knapsack, LCS, edit distance, coin change", "Start with recursion + memoisation, then optimise to tabulation"] },
      d5: { what: "Quicksort (avg O(n log n), in-place) partitions around a pivot. Mergesort (O(n log n), stable) divides and merges. Binary search finds a target in O(log n) on sorted input.", why: "Sorting is fundamental. FAANG expects you to know the trade-offs. Binary search variants (first occurrence, rotated array) appear frequently in coding rounds.", points: ["Mergesort is stable and predictable; quicksort has O(n²) worst case", "Binary search template: lo=0, hi=n-1, mid=(lo+hi)>>1, check and narrow", "Rotated sorted array binary search: determine which half is sorted first", "JavaScript Array.sort() uses TimSort (hybrid merge+insertion) — it's stable"] },
      d6: { what: "Hash maps store key-value pairs with O(1) average lookup. Hash sets store unique keys. LRU Cache combines a hash map with a doubly-linked list for O(1) get/put.", why: "Hash maps power countless optimisations — turning O(n²) brute force into O(n). LRU cache implementation is a classic FAANG question testing data structure design.", points: ["Map vs Object: Map allows any key type and is faster for frequent add/delete", "new Map() preserves insertion order; plain objects do too since ES2015", "LRU Cache: doubly-linked list (order) + Map (O(1) lookup) = O(1) both ops", "Common: two sum, group anagrams, subarray sum equals k"] },
      // Browser APIs
      b1: { what: "Programmatically creating, querying, modifying, and removing DOM elements. MutationObserver watches for DOM changes asynchronously.", why: "Direct DOM manipulation underlies every framework. FAANG frontend rounds sometimes include vanilla JS tasks where you must do it without React.", points: ["querySelector returns first match; querySelectorAll returns NodeList", "DocumentFragment batches DOM insertions to minimise reflows", "MutationObserver is efficient — use instead of polling", "cloneNode(true) deep-clones an element with all descendants"] },
      b2: { what: "localStorage persists across sessions. sessionStorage persists per tab. IndexedDB is a client-side database for large structured data. Cookies are sent to the server with every request.", why: "Client-side storage is used for caching, offline support, and user preferences. Knowing trade-offs (size limits, security, expiry) is expected at senior level.", points: ["localStorage: ~5MB, synchronous, string-only — serialise with JSON", "IndexedDB: GB scale, async, supports transactions and indexes", "Never store JWTs or sensitive data in localStorage — XSS-accessible", "Cookies with HttpOnly + SameSite=Strict prevent XSS/CSRF stealing"] },
      b3: { what: "IntersectionObserver fires a callback when elements enter or exit the viewport, with an optional rootMargin and threshold.", why: "It's the performant way to implement lazy loading, infinite scroll, and scroll-triggered animations without expensive scroll event listeners.", points: ["threshold: 0.5 fires when 50% of element is visible", "rootMargin: '200px 0px' pre-loads images 200px before they appear", "Disconnect the observer after the element is loaded to free memory", "Replaces getBoundingClientRect() in scroll handlers — much better perf"] },
      b4: { what: "Web Workers run JavaScript on a separate thread, preventing heavy computation from blocking the main UI thread. SharedArrayBuffer enables shared memory between workers.", why: "For data-heavy apps (video editors, IDEs, data viz), running computation off the main thread is essential for 60fps UI. FAANG products like Google Sheets, Figma use workers heavily.", points: ["Workers communicate via postMessage() — data is copied (structured clone)", "SharedArrayBuffer with Atomics enables true shared memory (needs COOP/COEP headers)", "Module workers: new Worker('./w.js', { type: 'module' })", "Don't import large libraries in workers — they have their own memory footprint"] },
      // React
      r1: { what: "JSX compiles to React.createElement() calls. Functional components are JavaScript functions returning JSX. Props flow down; components compose by nesting.", why: "React is the dominant FAANG frontend framework (Meta invented it). Understanding the component model is prerequisite for everything else in the React ecosystem.", points: ["Keys on list items must be stable, unique IDs — not array indices", "React.memo wraps a component to skip re-render if props haven't changed", "Composition via children prop is more flexible than inheritance", "Fragment (<>) avoids unnecessary DOM wrapper nodes"] },
      r2: { what: "useState manages local component state. useEffect synchronises with side effects. useRef persists mutable values across renders without triggering re-renders. useCallback/useMemo optimise performance by memoising functions and values.", why: "Hooks are the heart of React development. Misusing useEffect is the #1 source of bugs in React apps. FAANG interviews test hook understanding deeply.", points: ["useEffect with [] runs once on mount; with [dep] runs when dep changes", "useRef is perfect for DOM refs and storing previous values", "useMemo is for expensive computations; useCallback is for stable function references", "Avoid 'too many re-renders' by ensuring state updates don't cause infinite loops"] },
      r3: { what: "Context API provides a way to pass data through the component tree without prop drilling. createContext() creates a context, useContext() consumes it.", why: "Every medium-to-large React app uses Context for theme, auth, locale, or settings. It's the first solution to prop drilling that FAANG codebases reach for.", points: ["Split contexts by concern — don't put everything in one giant context", "Context re-renders ALL consumers when value changes — split or memoize", "Use React.memo on consumers to prevent unnecessary re-renders", "Context is not a replacement for state management at large scale"] },
      r4: { what: "Custom hooks extract component logic into reusable functions prefixed with 'use'. They can use any built-in hook internally.", why: "FAANG codebases have hundreds of custom hooks. They're the primary way to share stateful logic between components, and interviewers ask you to write them in coding rounds.", points: ["useFetch, useDebounce, useLocalStorage, useWindowSize are classic examples", "Custom hooks can call other custom hooks — full composition", "A hook must start with 'use' for React's linter rules to apply", "They're just functions — test them with renderHook() from Testing Library"] },
      r5: { what: "React 18 introduces concurrent rendering — React can interrupt, pause, and resume renders. useTransition marks state updates as non-urgent. Suspense boundaries catch async loading states. Streaming SSR renders on the server in chunks.", why: "Concurrent features are the future of React performance at scale. FAANG roles require knowing React 18 patterns for fast, responsive apps.", points: ["startTransition marks an update as non-urgent — won't block user input", "<Suspense fallback={<Spinner/>}> wraps async components or data fetching", "Streaming SSR with renderToPipeableStream sends HTML in chunks — faster TTFB", "useId generates stable IDs for accessibility in server-rendered apps"] },
      r6: { what: "Error boundaries are React class components that catch JavaScript errors in their child tree and display a fallback UI instead of crashing.", why: "Production React apps must not crash entirely when one component fails. FAANG engineers are expected to add error boundaries at key points in the component tree.", points: ["Use getDerivedStateFromError to update state and show fallback UI", "componentDidCatch receives the error and info for logging", "Libraries like react-error-boundary provide a simpler functional interface", "Wrap routes, data-fetching components, and third-party widgets in error boundaries"] },
      // State
      s1: { what: "Redux Toolkit (RTK) is the official, modern way to write Redux. createSlice() generates actions + reducer. RTK Query handles server state fetching and caching.", why: "Redux is used across most large FAANG React apps. RTK reduces boilerplate massively. RTK Query competes with React Query for server state management.", points: ["createSlice generates action creators and reducer in one call", "configureStore sets up DevTools and middleware automatically", "RTK Query auto-generates hooks: useGetUsersQuery, useAddUserMutation", "immer is built into RTK — mutate state directly in reducers (it's safe)"] },
      s2: { what: "Zustand is a small, fast state management library using a simple hook-based API. Jotai uses atomic state — individual atoms that components subscribe to.", why: "Many FAANG teams choose Zustand/Jotai over Redux for new projects because of lower boilerplate. Knowing multiple options shows architectural breadth.", points: ["Zustand store: const useStore = create(set => ({ count: 0, inc: () => set(s => ({count: s.count+1})) }))", "Only components using a specific atom/selector re-render", "Jotai atoms compose like Recoil — derived atoms with get(otherAtom)", "Both have excellent DevTools and TypeScript support"] },
      s3: { what: "React Query (TanStack Query) and SWR manage server state — fetching, caching, background refetching, pagination, and mutations. They separate 'server state' from 'client state'.", why: "The biggest insight in modern React architecture: server state (from APIs) and UI state (local) should be managed differently. React Query is the standard at many FAANG companies.", points: ["staleTime controls how long data is considered fresh before background refetch", "useQuery returns { data, isLoading, error, isFetching } — all you need", "useMutation provides optimistic updates and rollback on error", "QueryClient.invalidateQueries() triggers a refetch after a mutation"] },
      s4: { what: "State machines model UI as a finite set of states with explicit transitions. XState implements hierarchical, parallel statecharts in JavaScript.", why: "Complex UI flows (multi-step forms, auth, media players) have combinatorial state explosions. State machines make impossible states unrepresentable — a huge reliability win.", points: ["States: idle, loading, success, error — mutually exclusive", "Transitions are explicit: only defined transitions are allowed", "Guards are conditions on transitions: can(event) checks if transition is valid", "XState DevTools visualise the state machine as a diagram — great for debugging"] },
      // TypeScript
      t1: { what: "TypeScript's type system: primitive types, object types, union (A | B), intersection (A & B), literal types, type guards (instanceof, typeof, in), and discriminated unions.", why: "TypeScript is standard at all FAANG companies. Discriminated unions model domain state explicitly (e.g., loading | success | error) and eliminate entire classes of runtime bugs.", points: ["Union: type Result = Success | Failure — one of these shapes", "Discriminated union: each branch has a common tag field (type: 'success')", "Type guard: function isError(x): x is Error { return x instanceof Error }", "unknown is safer than any — forces you to narrow before use"] },
      t2: { what: "Generics make functions, interfaces, and types work over multiple types while preserving type information. Built-in utility types: Partial<T>, Required<T>, Readonly<T>, Pick<T,K>, Omit<T,K>, Record<K,V>.", why: "Generics are used throughout every TypeScript codebase. Utility types let you transform existing types without duplication. FAANG TypeScript rounds test generic function signatures.", points: ["function identity<T>(x: T): T — T is inferred at call site", "Partial<User> makes all fields optional — perfect for update payloads", "Pick<User, 'id' | 'name'> creates a new type with only those fields", "ReturnType<typeof fn> extracts the return type of a function"] },
      t3: { what: "Typing React components with FC<Props>, typing event handlers (React.ChangeEvent<HTMLInputElement>), forwardRef with generics, and typing custom hooks.", why: "TypeScript + React is the standard at FAANG. Getting the types right catches prop mismatches at compile time and makes components self-documenting.", points: ["Prefer explicit Props type over FC<> — avoids implicit children prop issue", "React.MouseEvent<HTMLButtonElement> for click handlers", "useRef<HTMLInputElement>(null) for DOM refs", "ComponentPropsWithoutRef<'button'> extends all native button props"] },
      t4: { what: "TypeScript strict mode enables strict null checks, implicit any errors, and other safety rules. Configuring tsconfig.json for maximum safety.", why: "Strict mode prevents the most common TypeScript mistakes. FAANG codebases run strict — knowing what each flag does shows you're beyond surface-level TypeScript.", points: ["strict: true enables strictNullChecks, noImplicitAny, strictFunctionTypes, and more", "noUncheckedIndexedAccess makes arr[i] return T | undefined — safer", "Use @ts-expect-error (not @ts-ignore) so you get warned when the error is fixed", "Incrementally enable strict flags in legacy codebases — don't do all at once"] },
      // Testing
      te1: { what: "Unit tests verify individual functions or components in isolation. Jest/Vitest provide test runners, assertions, mocking, and coverage reports.", why: "FAANG expects every engineer to write tests. Untested code is unmaintainable at scale. Mocking lets you test logic without real network calls or databases.", points: ["Arrange-Act-Assert (AAA) pattern keeps tests readable", "jest.mock() replaces a module with a fake — ideal for API calls", ".toMatchSnapshot() catches unexpected output changes", "Aim for 80% branch coverage on critical paths; 100% is often not worth it"] },
      te2: { what: "React Testing Library renders components into a real DOM (jsdom) and queries by accessibility attributes (role, label, text) — testing what the user sees, not implementation details.", why: "RTL is the standard at FAANG React teams. It encourages writing tests from the user's perspective, which are more resilient to refactoring.", points: ["getByRole('button', { name: /submit/i }) is the preferred query", "userEvent.click() is more realistic than fireEvent — use it", "waitFor() retries assertions until they pass — for async state updates", "Avoid queryByTestId — it couples tests to implementation, not behaviour"] },
      te3: { what: "Playwright automates real browser interactions for end-to-end testing — filling forms, clicking, navigating — against a running application.", why: "E2E tests catch integration bugs that unit tests miss. FAANG CI pipelines run Playwright on every PR. Knowing page object model and network interception is expected at senior level.", points: ["Page Object Model separates locator logic from test logic — reusable", "await page.route('**/api/**', route => route.fulfill({ body: mockData })) intercepts network", "test.use({ storageState: 'auth.json' }) reuses auth state across tests", "Run tests in parallel (Playwright default) and retry flaky tests 2x"] },
      te4: { what: "The test pyramid: many unit tests at the base, fewer integration tests in the middle, few E2E tests at the top. TDD writes the test before the implementation.", why: "Writing the wrong tests is as bad as writing no tests. FAANG code reviews check for meaningful coverage, not just numbers. Understanding strategy prevents over-testing UI details.", points: ["Unit tests: fast, cheap, isolated — write many", "Integration tests: test component + hooks + API together", "E2E: slow, expensive — cover critical user flows only", "TDD's red-green-refactor loop improves design and ensures coverage"] },
      // Node
      n1: { what: "Node.js uses libuv for its event loop — different from the browser. The loop phases: timers → pending I/O → idle/prepare → poll → check (setImmediate) → close callbacks.", why: "Node internals appear in FAANG backend and full-stack rounds. Understanding the event loop explains why async I/O is fast and where blocking code causes problems.", points: ["setImmediate fires in the check phase — after I/O callbacks", "process.nextTick fires before any other phase — use sparingly (can starve I/O)", "CPU-bound work blocks the event loop — offload to worker threads", "Streams are the Node way to handle large files without loading all into memory"] },
      n2: { what: "Streams are objects that let you read/write data piece by piece. Readable, Writable, Transform streams. Backpressure prevents fast producers from overwhelming slow consumers.", why: "Handling large files, video uploads, or real-time data requires streams. Without understanding backpressure you'll build systems that run out of memory under load.", points: ["pipe() connects readable to writable and handles backpressure automatically", "Transform stream is both readable and writable — use for compression, parsing", "highWaterMark sets buffer size — too large wastes memory, too small reduces throughput", "async iteration: for await (const chunk of readableStream) is the modern API"] },
      n3: { what: "npm/pnpm for dependency management. package.json scripts automate builds. Workspaces manage monorepos. lockfiles ensure reproducible installs. npm audit checks for vulnerabilities.", why: "Dependency management is a daily engineering activity. Understanding workspaces, hoisting, and audit is expected on any team using Node tooling.", points: ["package-lock.json / pnpm-lock.yaml must be committed to source control", "pnpm is faster and more disk-efficient than npm due to content-addressable store", "npm audit fix --force can introduce breaking changes — review before running", "Semantic versioning: ^1.2.3 allows minor/patch updates; ~1.2.3 allows patch only"] },
      n4: { what: "Express is a minimal Node.js web framework with middleware-based request handling. Fastify is a modern alternative that is significantly faster with built-in schema validation.", why: "Express is in most Node.js codebases you'll encounter or maintain. Even as a frontend dev, understanding how a server is structured helps you collaborate with backend teams.", points: ["Middleware functions have signature (req, res, next) — call next() to continue", "Error-handling middleware has 4 args: (err, req, res, next)", "Router groups routes — use for versioned API modules", "Fastify's JSON schema validation is ~5x faster than manual validation"] },
      n5: { what: "REST API design principles: resource naming (nouns, not verbs), correct HTTP methods (GET/POST/PUT/PATCH/DELETE), status codes, versioning (/v1/), and pagination.", why: "You'll consume and sometimes design REST APIs throughout your career. FAANG system design rounds test whether you design clean, predictable APIs.", points: ["GET /users — list; POST /users — create; GET /users/:id — read one", "204 No Content for successful DELETE; 201 Created for successful POST", "Use query params for filtering/sorting: GET /users?role=admin&sort=name", "Pagination: offset (skip/limit) or cursor-based (more scalable for large datasets)"] },
      n6: { what: "GraphQL is a query language and runtime where clients specify exactly what data they need. Schema defines types, queries, mutations, and subscriptions. Resolvers fetch the data.", why: "Many FAANG companies (Meta invented GraphQL, GitHub, Shopify use it) run GraphQL APIs. Frontend devs need to know how to query, mutate, and avoid N+1 problems.", points: ["Over-fetching and under-fetching problems are solved by client-specified queries", "DataLoader batches and caches resolver calls to prevent N+1 database queries", "Fragments reuse field sets across multiple queries", "Apollo Client / urql handle client-side caching, optimistic updates"] },
      n7: { what: "JWT (JSON Web Token) is a self-contained token with header.payload.signature. OAuth2 is an authorization framework. Refresh tokens allow getting new access tokens without re-login.", why: "Auth is in every app. FAANG security teams scrutinise auth flows. Understanding JWT storage risks, refresh token rotation, and OAuth flows is required for senior roles.", points: ["Never store JWTs in localStorage — use httpOnly cookie instead to prevent XSS theft", "Access token: short-lived (15min). Refresh token: long-lived (7 days), stored httpOnly", "OAuth2 Authorization Code Flow + PKCE is the secure browser flow", "Validate JWT signature on every request — don't trust payload without verification"] },
      // DB
      n8: { what: "SQL fundamentals: SELECT with JOIN (INNER, LEFT, RIGHT), GROUP BY + HAVING, indexes for performance, EXPLAIN ANALYZE to see query plans, and ACID transactions.", why: "Even frontend engineers need to understand SQL when working with backend APIs, writing data migrations, or debugging performance. FAANG full-stack roles test SQL.", points: ["Index on columns used in WHERE, JOIN ON, and ORDER BY clauses", "EXPLAIN ANALYZE reveals table scans vs index scans — spot slow queries", "Avoid N+1: one query with JOIN > N separate queries in a loop", "Transactions ensure atomicity — either all changes commit or none do"] },
      n9: { what: "MongoDB stores documents (JSON-like) in collections without a fixed schema. Redis is an in-memory key-value store used for caching and pub/sub messaging.", why: "Modern FAANG stacks often use both SQL and NoSQL. Redis is ubiquitous for caching, sessions, and rate limiting. Understanding when to use each is a system design skill.", points: ["MongoDB shines for hierarchical data and fast schema iteration", "Redis SET key value EX 3600 — cache with 1-hour expiry", "Redis pub/sub enables real-time broadcasting without WebSocket server state", "NoSQL is not inherently 'faster' than SQL — it depends on access patterns"] },
      n10: { what: "ORMs (Object-Relational Mappers) like Prisma map database tables to TypeScript objects. Query builders like Drizzle give SQL-like syntax with type safety. Migrations manage schema changes.", why: "Manual SQL in large codebases leads to errors and type unsafety. ORMs provide autocomplete, type safety, and migration tooling. Prisma is popular at FAANG-adjacent companies.", points: ["Prisma schema defines models; prisma migrate dev generates SQL and applies it", "Prisma generates a fully typed client based on your schema", "Drizzle lets you write SQL-like queries with TypeScript types — less magic than Prisma", "Never run migrations directly in production during peak traffic — use zero-downtime strategies"] },
      // Performance
      perf1: { what: "LCP (Largest Contentful Paint) measures when the main content is visible. Target: < 2.5s. Optimise by preloading hero images, reducing server response time, and removing render-blocking resources.", why: "LCP is Google's primary ranking signal for page experience. A poor LCP directly costs search ranking and ad revenue at FAANG scale. It's one of the first things SREs check.", points: ["<link rel='preload' as='image'> on your hero image — biggest single win", "fetchpriority='high' on the LCP image element", "Reduce server TTFB to < 600ms (use CDN, caching, edge functions)", "Remove unused CSS/JS that blocks the render-blocking critical path"] },
      perf2: { what: "CLS (Cumulative Layout Shift) measures unexpected visual movement. Target: < 0.1. Caused by images without dimensions, dynamically injected content, and late-loading fonts.", why: "CLS breaks user interactions — buttons that move as the user clicks them. Google penalises high CLS in search rankings.", points: ["Always set width + height attributes on img elements — even with CSS sizing", "Reserve space for ads and embeds with min-height containers", "font-display: optional prevents FOUT that causes layout shifts", "content-visibility: auto defers off-screen rendering but can cause CLS — measure first"] },
      perf3: { what: "INP (Interaction to Next Paint) replaced FID. Measures responsiveness from input to next paint. Target: < 200ms. Caused by long tasks blocking the main thread.", why: "Poor INP makes apps feel sluggish. Google now uses INP as a Core Web Vital ranking factor. Optimising it requires deep understanding of the rendering pipeline.", points: ["Break long tasks into chunks with scheduler.yield() or setTimeout(0)", "Use isInputPending() to yield when user is interacting", "Debounce expensive event handlers (resize, scroll, keyup)", "React 18 useTransition keeps UI responsive during heavy state updates"] },
      perf4: { what: "TTFB (Time To First Byte) is server response time. Cache-Control headers control browser/CDN caching. stale-while-revalidate serves stale cache while refreshing in background.", why: "Caching is the most impactful performance technique at FAANG scale — serving from cache is orders of magnitude faster than hitting origin servers.", points: ["Cache-Control: max-age=31536000, immutable for fingerprinted static assets", "Cache-Control: no-cache means always revalidate with server before using cache", "stale-while-revalidate=86400 serves stale for 1 day while revalidating", "Use ETag or Last-Modified for conditional requests — 304 Not Modified saves bandwidth"] },
      perf5: { what: "Webpack and Vite bundle JavaScript modules into optimised output files. Loaders transform files (TypeScript, CSS). Plugins extend functionality. HMR updates modules in the browser without full reload.", why: "Build tooling directly impacts developer productivity and final bundle size. FAANG engineers are expected to configure and optimise bundlers, not just use them as black boxes.", points: ["Tree shaking removes exports that are never imported — requires ESM", "SplitChunks plugin separates vendor code (node_modules) from app code", "Vite uses native ESM in dev for instant HMR; Rollup for production builds", "Source maps map minified production errors back to original source code"] },
      perf6: { what: "Code splitting divides your JavaScript bundle into smaller chunks loaded on demand. React.lazy() dynamically imports a component. Route-based splitting loads only the code for the current page.", why: "A 1MB single bundle blocks the page until fully parsed. Splitting means users download only what they need for the current route — directly improving LCP.", points: ["const Chart = React.lazy(() => import('./Chart')) + <Suspense fallback={...}>", "React Router's lazy route loading is built-in since v6.4", "Preload critical chunks: <link rel='modulepreload' href='/chunk.js'>", "Use webpack-bundle-analyzer to find what's in your chunks"] },
      perf7: { what: "Serving next-gen image formats (WebP saves 30%, AVIF saves 50% vs JPEG). Compression (Brotli > gzip). Font subsetting and font-display strategy.", why: "Images are 60% of a typical page's weight. Image optimisation often gives the single biggest perf win with minimal engineering effort.", points: ["<picture> with <source type='image/avif'> + <source type='image/webp'> + <img> fallback", "Brotli level 11 compression on text assets — configure on your CDN", "font-display: swap shows text immediately with FOUT; font-display: optional avoids layout shift", "Subset fonts to only the characters used — removes 70%+ of font file size"] },
      perf8: { what: "webpack-bundle-analyzer visualises what's in your bundle. Identifies large dependencies, duplicate modules, and code that shouldn't be in the client bundle.", why: "Developers routinely ship 10x larger bundles than necessary due to accidental imports. Bundle analysis is how you find and fix them.", points: ["Run: npx webpack-bundle-analyzer stats.json", "Common culprits: moment.js (280kb) → use date-fns, lodash (full) → use lodash-es + tree shake", "Dynamic import() for rarely-used features (rich text editor, PDF viewer)", "Check that your SSR/server-only code isn't accidentally bundled for the browser"] },
      perf9: { what: "CSR (Client-Side Rendering) — empty HTML, JS renders in browser. SSR (Server-Side Rendering) — full HTML from server per request. SSG (Static Site Generation) — pre-built at deploy time. ISR (Incremental Static Regeneration) — SSG pages rebuilt on a schedule.", why: "Choosing the wrong rendering strategy hurts SEO, performance, or developer experience. FAANG senior roles require knowing which strategy to apply to which problem.", points: ["CSR: best for dashboards behind auth (no SEO needed, rich interactivity)", "SSR: best for personalised pages with SEO needs (e-commerce product pages)", "SSG: best for content that rarely changes (docs, marketing pages)", "ISR: SSG but pages can be revalidated every N seconds — Next.js feature"] },
      perf10: { what: "Next.js App Router uses React Server Components — components that render on the server with direct database access and zero JS sent to client. Streaming sends HTML in chunks as data resolves.", why: "Next.js + React Server Components is the cutting-edge architecture at top companies. FAANG interviews increasingly test knowledge of RSC and the App Router.", points: ["Server Components have no state, no effects, no browser APIs — they're async functions", "Client Components are marked 'use client' and work like traditional React", "fetch() in Server Components is automatically deduped and cached", "Streaming with Suspense: <Suspense fallback> wraps slow data-fetching server components"] },
      perf11: { what: "Partial hydration only hydrates interactive parts of the page. Islands architecture (popularised by Astro) renders the bulk of the page as static HTML with small interactive islands.", why: "Traditional SSR + hydration ships ALL the JS to the client to make the page interactive, even for mostly-static content. Islands architecture dramatically reduces JS sent.", points: ["Astro ships zero JS by default — add client:load only for interactive components", "React Server Components achieve a similar result within the React model", "Partial hydration is key for content sites where most content is static", "The goal: ship the minimum JS needed for interactivity — not the whole framework"] },
      perf12: { what: "Virtual scrolling (windowing) only renders the DOM nodes visible in the viewport. Instead of 10,000 <li> elements, it renders ~20 and repositions them as the user scrolls.", why: "Long lists without virtualisation crash browsers. Every FAANG product with large data tables (Gmail, Sheets, Maps) uses windowing. react-virtual / react-window are standard.", points: ["TanStack Virtual (react-virtual) is flexible and framework-agnostic", "react-window is simpler for fixed-size item lists", "Total container height = itemHeight × totalItems — maintains correct scrollbar", "Dynamic item heights require measuring — use ResizeObserver on items"] },
      // System design
      sd1: { what: "Design systems define visual language (tokens, colours, spacing) and component libraries (Button, Input, Modal). Atomic design organises components as atoms → molecules → organisms. Storybook documents and showcases components.", why: "Every FAANG product team maintains a design system. Building one is a senior engineering challenge that combines API design, accessibility, performance, and documentation.", points: ["Design tokens (CSS variables) are the single source of truth for colour/spacing", "Components should be accessible out of the box — don't make consumers opt-in", "Versioning with semver: breaking changes = major version bump", "Storybook stories serve as living documentation and visual regression test targets"] },
      sd2: { what: "Micro-frontends split a large frontend into independently deployable pieces owned by separate teams. Module Federation (Webpack 5) lets apps load remote modules at runtime.", why: "At FAANG scale, a monolithic frontend becomes a bottleneck. Micro-frontends let 50 teams ship independently. Understanding the trade-offs is a senior system design skill.", points: ["Module Federation: a 'host' app loads 'remotes' that expose components at runtime", "Shared dependencies (React) should be marked as singletons to avoid version conflicts", "Contract testing ensures remotes and host agree on prop interfaces", "Trade-offs: operational complexity, shared state is harder, debugging is harder"] },
      sd3: { what: "Monorepos contain multiple packages in one repo. Turborepo and Nx provide incremental builds — only rebuild packages whose inputs changed. Shared packages (utils, types, UI) live as local dependencies.", why: "Every FAANG team with multiple apps uses a monorepo. Understanding caching, task pipelines, and code sharing is expected on platform/infra teams.", points: ["Turborepo caches task outputs by input hash — identical inputs reuse the cache", "Remote caching shares cache across all developers and CI — massive speed gain", "Define task pipeline in turbo.json: build depends on ^build (dependencies first)", "pnpm workspaces are the recommended package manager for monorepos"] },
      sd4: { what: "Feature flags decouple deployment from release. You ship code to production in a disabled state, then enable it for specific user segments (% rollout, employee testing, beta users).", why: "Every FAANG product uses feature flags for safe, gradual releases. They allow A/B testing, instant kill switches, and canary deployments without redeployment.", points: ["LaunchDarkly, GrowthBook, Unleash are common platforms", "Keep flag evaluation fast — cache in memory, don't block rendering", "Remove stale flags — flag debt slows down codebases and creates confusion", "Flags should be checked server-side for sensitive features to prevent client manipulation"] },
      sd5: { what: "A CDN (Content Delivery Network) serves assets from edge nodes close to the user. Edge functions run code at CDN nodes — closest to the user. Cache invalidation updates or purges stale CDN content.", why: "CDNs are how FAANG serves billions of users with low latency. Without a CDN, all requests hit origin servers in one location. CDN knowledge is essential in system design rounds.", points: ["Assets with fingerprinted filenames (main.abc123.js) can be cached forever", "Use Cache-Control: stale-while-revalidate for CDN edge caching with background refresh", "Edge functions (Cloudflare Workers, Vercel Edge) personalise responses at edge", "Cache invalidation is hard — design cache keys carefully to avoid stale data"] },
      sd6: { what: "Service Workers are JavaScript scripts that run in a background thread, intercepting network requests. They enable offline support, push notifications, and background sync.", why: "PWAs with service workers are used in markets with poor connectivity (emerging markets FAANG targets). Push notifications are a key engagement mechanic.", points: ["Precache app shell (HTML, CSS, JS) at service worker install — instant offline load", "Runtime caching: stale-while-revalidate for API responses", "Push notifications require user permission — request it contextually, not on page load", "Workbox (Google library) simplifies service worker strategies with presets"] },
      sd7: { what: "XSS (Cross-Site Scripting) injects malicious scripts. CSRF (Cross-Site Request Forgery) tricks users into unintended actions. CSP (Content Security Policy) whitelist restricts which scripts can run.", why: "Security vulnerabilities at FAANG can affect billions of users. Interviewers test security awareness as part of seniority. One XSS bug can lead to mass account compromise.", points: ["Sanitise all user input rendered as HTML — use DOMPurify", "HttpOnly cookies are inaccessible to JavaScript — use for auth tokens", "CSP header: default-src 'self' — only load resources from your own origin", "SameSite=Strict on cookies blocks cross-origin POST requests (CSRF protection)"] },
      sd8: { what: "Observability combines logging, metrics, and distributed tracing. Sentry captures frontend errors with stack traces. RUM (Real User Monitoring) tracks real-world performance metrics.", why: "You can't fix bugs you can't see. FAANG products instrument every user interaction. An error monitoring setup is one of the first things a new team sets up.", points: ["Sentry.captureException(err) with context gives actionable error reports", "Group errors by fingerprint, not individual occurrences — focus on highest impact", "Web Vitals RUM: use reportWebVitals() or web-vitals library to send to analytics", "Alert on error rate increase, not just absolute count — catches regressions on new releases"] },
      // System design interview
