<style>
:root {
  --bg-main: #f0f2f5; --bg-card: #ffffff;
  --text-primary: #000000; --text-secondary: #5f6368; --text-muted: #9aa0a6;

  --border-radius-lg: 24px; --border-radius-md: 16px; --border-radius-pill: 9999px;
  --font-sans: 'Outfit','Inter',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { max-width:1200px; margin:0 auto; background:var(--bg-main); font-family:var(--font-sans); color:var(--text-primary); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5; }

.cover-subtitle { font-size:14px; letter-spacing:.05em; color:var(--text-secondary); font-weight:500; margin-bottom:.5rem; }
.cover-title { font-size:40px; font-weight:700; letter-spacing:-.02em; margin-bottom:.5rem; color:var(--text-primary); }
.cover-name { font-size:16px; color:var(--text-secondary); font-weight:500; margin-bottom:2rem; display:flex; align-items:center; gap:6px; }
.badge-faang { background:#EEEDFE; color:#3C3489; font-size:14px; font-weight:500; padding:2px 6px; border-radius:6px; }
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1.25rem; margin-bottom:2rem; }
.stat { background:var(--bg-card); padding:1.5rem; border-radius:var(--border-radius-lg); box-shadow:0 4px 20px rgba(0,0,0,.03); }
.stat-val { font-size:36px; font-weight:600; color:var(--text-primary); line-height:1.1; margin-bottom:8px; }
.stat-label { font-size:14px; color:var(--text-secondary); font-weight:500; }
.progress-track { height:8px; background:var(--bg-main); border-radius:var(--border-radius-pill); margin-bottom:.75rem; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent-black); border-radius:var(--border-radius-pill); transition:width .6s cubic-bezier(.22,1,.36,1); }
.progress-label { font-size:13px; color:var(--text-secondary); font-weight:500; }
.streak-box { display:inline-flex; align-items:center; gap:8px; background:var(--pastel-yellow); padding:8px 16px; border-radius:var(--border-radius-pill); margin-top:1.5rem; }
.streak-flame { font-size:18px; }
.streak-text { font-size:14px; color:var(--accent-black); font-weight:600; }
.today-box { background:var(--pastel-mint); padding:1.5rem; border-radius:var(--border-radius-lg); margin-bottom:2rem; margin-inline:2rem; }
.today-label { font-size:13px; color:var(--accent-black); font-weight:600; margin-bottom:.5rem; opacity:.8; }
.today-text { font-size:16px; color:var(--accent-black); line-height:1.5; font-weight:500; }
.phase-nav { display:flex; gap:.75rem; background:var(--bg-main); overflow-x:auto; scrollbar-width:none; margin-inline:2rem; }
.phase-nav::-webkit-scrollbar { display:none; }
.phase-tab { font-size:14px; font-weight:500; padding:10px 20px; cursor:pointer; color:var(--text-secondary); background:var(--bg-card); border-radius:var(--border-radius-pill); border:1px solid transparent; white-space:nowrap; transition:all .2s; box-shadow:0 2px 10px rgba(0,0,0,.02); }
.phase-tab.active { color:var(--accent-white); background:var(--accent-black); box-shadow:0 4px 15px rgba(0,0,0,.1); }
.phase-tab.done { color:var(--text-primary); background:var(--pastel-mint); }
.phase-tab.active.done { color:var(--accent-white); background:var(--accent-black); }
.phase-tab:hover:not(.active) { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.05); }
.content { padding:2rem 2.5rem; max-width:900px; margin-inline:auto; }
.chapter-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:1.5rem; background:var(--pastel-purple); padding:2rem; border-radius:var(--border-radius-lg); }
.chapter-num { font-size:14px; color:var(--accent-black); font-weight:600; margin-bottom:.5rem; opacity:.8; }
.chapter-title { font-size:32px; font-weight:600; color:var(--accent-black); letter-spacing:-.01em; }
.chapter-meta { text-align:right; }
.chapter-week { font-size:16px; color:var(--accent-black); font-weight:600; }
.chapter-time { font-size:14px; color:var(--accent-black); opacity:.8; margin-top:4px; font-weight:500; }
.phase-progress-bar { height:6px; background:var(--bg-card); border-radius:var(--border-radius-pill); margin-bottom:2.5rem; overflow:hidden; }
.phase-progress-fill { height:100%; background:var(--accent-black); transition:width .4s; border-radius:var(--border-radius-pill); }
.section-head { font-size:20px; color:var(--text-primary); font-weight:600; margin-bottom:1.25rem; margin-top:2.5rem; display:flex; align-items:center; gap:10px; }
.section-head::before { content:''; display:inline-block; width:12px; height:12px; background:var(--pastel-yellow); border-radius:50%; }
.check-item { display:flex; align-items:flex-start; gap:16px; padding:16px; background:var(--bg-card); border-radius:var(--border-radius-md); margin-bottom:12px; cursor:pointer; transition:all .2s; box-shadow:0 2px 8px rgba(0,0,0,.02); }
.check-item:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.05); }
.check-item input[type=checkbox] { margin-top:4px; accent-color:var(--accent-black); width:20px; height:20px; cursor:pointer; flex-shrink:0; border-radius:4px; }
.check-item label { font-size:15px; color:var(--text-primary); cursor:pointer; line-height:1.5; flex:1; font-weight:500; }
.check-item.checked { background:var(--pastel-mint); }

.move-on-box,.stuck-box { background:var(--bg-card); padding:24px; margin-top:2rem; border-radius:var(--border-radius-lg); box-shadow:0 4px 20px rgba(0,0,0,.03); display:flex; flex-direction:column; gap:8px; }
.move-on-box { background:var(--pastel-pink); }

.sidebar-overlay.open { display:block; }
.sidebar-panel { position:fixed; top:0; right:-480px; width:460px; max-width:92vw; height:100%; background:#fff; z-index:2001; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,.15); transition:right .35s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; }
.sidebar-panel.open { right:0; }
.sidebar-header { display:flex; align-items:center; gap:14px; padding:1.5rem; background:var(--pastel-purple); flex-shrink:0; }
.sidebar-icon { font-size:1.5rem; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.06); border-radius:12px; }

.sidebar-close { margin-left:auto; background:rgba(0,0,0,.06); border:none; color:var(--accent-black); width:32px; height:32px; border-radius:8px; font-size:1rem; cursor:pointer; transition:background .2s; }
.sidebar-close:hover { background:rgba(0,0,0,.1); }
.sidebar-body { padding:1.5rem; flex:1; }
.sidebar-body h3 { font-size:.9rem; font-weight:700; margin-bottom:.5rem; color:var(--accent-black); }
.sidebar-body p { font-size:.85rem; color:var(--text-secondary); line-height:1.7; margin-bottom:1rem; }
.sidebar-body ul { list-style:none; padding:0; }
.sidebar-body li { font-size:.85rem; color:var(--text-secondary); padding:6px 0 6px 1.2rem; position:relative; line-height:1.5; }
.sidebar-body li::before { content:"•"; position:absolute; left:0; color:var(--accent-black); font-weight:bold; }
.info-block { margin-bottom:1.25rem; }
.info-block-label { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.info-block-text { font-size:14px; color:var(--text-primary); line-height:1.7; }
.key-points { display:flex; flex-direction:column; gap:6px; }
.key-point { display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--text-primary); line-height:1.6; }
.key-point-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent-black); margin-top:8px; flex-shrink:0; }
.mark-done-btn.already-done { background:var(--pastel-mint); color:var(--accent-black); opacity:.8; }
.sidebar-footer { padding:1rem 1.5rem; border-top:1px solid rgba(0,0,0,.07); flex-shrink:0; }
.mark-done-btn { width:100%; padding:12px; font-size:.9rem; font-weight:700; border:none; border-radius:10px; background:var(--accent-black); color:var(--accent-white); cursor:pointer; font-family:inherit; transition:opacity .2s; }
.mark-done-btn:hover { opacity:.85; }
#sb-phase { font-size:.8rem; color:var(--text-secondary); }
.info-btn { width:24px; height:24px; border-radius:50%; border:1.5px solid rgba(0,0,0,.12); background:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-secondary); transition:all .15s; line-height:1; flex-shrink:0; font-family:var(--font-sans); }
.info-btn:hover { background:var(--pastel-purple-hover); border-color:var(--pastel-purple-hover); color:var(--accent-black); }
@media (max-width:640px) { .cover { padding:3rem 1.5rem 2rem; } .content { padding:2rem 1.5rem; } .chapter-head { flex-direction:column; align-items:flex-start; gap:1rem; } .chapter-meta { text-align:left; } }
</style>

<script>
const STORAGE_KEY='observability_journal_v1', STREAK_KEY='observability_streak_v1', GOALS_KEY='observability_goals_v1';

const PHASES = [
  { id:0, title:'Observability Foundations', emoji:'🔍', week:'Week 1', time:'45 min', icon:'🔍',
    items:[
      { id:'obf1', label:'What is Observability — definition, pillars, and why it matters', what:'Observability is the ability to measure the internal state of a system by examining its outputs (logs, metrics, traces). It answers "what is happening?" without deploying new code.', why:'Observability separates reactive firefighting from proactive system understanding — it\'s the foundation of running distributed systems in production.', points:[
        'Originated from control theory: a system is observable if you can infer internal state from external outputs',
        'Three pillars: logs (discrete events), metrics (aggregated data), traces (request lifecycle)',
        'Observability != monitoring — monitoring tells you something is wrong, observability tells you WHY',
        'Enables debugging of unknown-unknowns: failures you didn\'t anticipate or define alert rules for',
        'Key metric: MTTD (Mean Time to Detect) vs MTTR (Mean Time to Resolve) — observability reduces both',
        'High-cardinality data (user IDs, request IDs) is essential for effective observability'
      ]},
      { id:'obf2', label:'Observability vs Monitoring — black box vs white box', what:'Monitoring watches known failure modes with predefined dashboards and alerts. Observability enables ad-hoc investigation of any system behavior.', why:'The distinction determines your entire operations strategy — monitoring-only leaves you blind to novel failures.', points:[
        'Monitoring: black box — observe system from outside, check predefined health indicators',
        'Observability: white box — instrument the system to expose internal state for exploration',
        'Monitoring answers "is it working?" — observability answers "why isn\'t it working?"',
        'Monitoring creates known-knowns — observability surfaces unknown-unknowns',
        'Production: both are needed — monitoring for alerting, observability for root cause analysis',
        'Shift: move from "what can we monitor?" to "what questions will we need to answer?"'
      ]},
      { id:'obf3', label:'Cardinality & Dimensionality — low vs high', what:'Cardinality refers to the number of unique values a label/tag dimension can have. Low cardinality: HTTP methods (GET/POST). High cardinality: user IDs, request IDs.', why:'Cardinality is the #1 performance bottleneck in observability — choosing wrong dimensions makes systems slower or too expensive.', points:[
        'Low cardinality (<100 values): HTTP status codes, deployment versions, availability zones',
        'Medium cardinality (<10K values): service names, endpoint paths, error codes',
        'High cardinality (millions): user IDs, session IDs, request IDs, IP addresses',
        'Metrics engines (Prometheus) struggle with high cardinality — cardinality explosion kills performance',
        'Tracing naturally handles high cardinality via span IDs and trace IDs',
        'Strategy: use metrics for low-cardinality aggregations, traces for high-cardinality investigations'
      ]},
      { id:'obf4', label:'Maturity Model — levels of observability adoption', what:'Observability maturity model: level 0 (no instrumentation) → level 1 (basic metrics) → level 2 (pillars implemented) → level 3 (correlated telemetry) → level 4 (self-service, AI-assisted).', why:'Maturity models help you prioritize investments and communicate progress to stakeholders — know where you stand.', points:[
        'Level 0 — Dark: no instrumentation, SSH into servers, console.log debugging',
        'Level 1 — Basic: infrastructure metrics (CPU/memory/disk), simple uptime monitoring',
        'Level 2 — Instrumented: structured logging, RED metrics, basic tracing on critical paths',
        'Level 3 — Correlated: OpenTelemetry, trace-log-metric correlation, SLO-based alerting',
        'Level 4 — Proactive: AI-driven anomaly detection, auto-remediation, self-service observability platform',
        'Most orgs sit at Level 2 — reaching Level 3 is the architect-level differentiator'
      ]},
      { id:'obf5', label:'The Three Pillars deep dive: logs, metrics, traces', what:'Each pillar serves a different purpose: logs tell a story (what happened), metrics show trends (how many), traces map causality (where in the request flow).', why:'Understanding when to use each pillar (and their limitations) is the core skill of observability — no single pillar suffices.', points:[
        'Logs: high verbosity, structured JSON, contain detailed context — expensive to store and query at scale',
        'Metrics: lightweight, numeric, aggregated over time windows — lose individual request detail',
        'Traces: capture request flow across services — provide causality but have sampling overhead',
        'The pillars are not mutually exclusive — correlation between them is the real power',
        'OpenTelemetry unifies all three: traces carry context, metrics aggregate, logs attach to spans',
        'Analogy: logs = witness testimony, metrics = security camera summary, traces = surveillance footage'
      ]},
    ]
  },
  { id:1, title:'Logging', emoji:'📝', week:'Week 2', time:'45 min', icon:'📝',
    items:[
      { id:'olo1', label:'Structured vs Unstructured Logging', what:'Structured logging emits machine-parseable records (JSON) with consistent fields. Unstructured logging emits free-text strings that require regex to extract meaning.', why:'Structured logging is the baseline for any serious production system — unstructured logs are nearly impossible to query at scale.', points:[
        'Structured: {"level":"error","msg":"request failed","status":503,"duration_ms":4500,"trace_id":"abc123"}',
        'Unstructured: "ERROR: request failed - took 4500ms" — needs regex to parse, fragile to format changes',
        'JSON is the standard format — supports nested objects, arrays, and mixed types',
        'Pino: fastest Node.js logger (~5x faster than Winston) with native JSON support',
        'Logs should have: timestamp, level, message, service, trace_id, span_id, and domain-specific fields',
        'Avoid logging PII, secrets, or large payloads — use log redaction and sampling'
      ]},
      { id:'olo2', label:'Log Levels & Best Practices', what:'Log levels (fatal/error/warn/info/debug/trace) indicate severity. Production typically runs at info level, debug enabled per-request via feature flags.', why:'Correct log levels ensure signal-to-noise ratio in production — too verbose buries real issues, too sparse prevents debugging.', points:[
        'FATAL: application cannot continue — crash imminent, triggers on-call immediately',
        'ERROR: request failed, operation degraded — needs investigation but app survives',
        'WARN: unusual but handled — retry succeeded, fallback used, rate limit approaching',
        'INFO: significant lifecycle events — deployment, config change, user signup',
        'DEBUG: detailed context for troubleshooting — enable temporarily per-service via config',
        'TRACE: function-level entry/exit — rarely used, high volume, typically only in dev'
      ]},
      { id:'olo3', label:'Centralized Logging — ELK Stack, Loki, and Log Shipping', what:'Centralized logging aggregates logs from all services into a searchable store. ELK (Elasticsearch, Logstash, Kibana) and Grafana Loki are the dominant stacks.', why:'Logs on individual servers are useless in distributed systems — centralized search and correlation is mandatory.', points:[
        'ELK stack: Logstash parses/ships → Elasticsearch indexes → Kibana visualizes',
        'Grafana Loki: push-based, stores compressed logs, indexes by labels (not full-text)',
        'Log shipping agents: Filebeat (ELK), Promtail (Loki), Fluentd/Fluent Bit (vendor-neutral)',
        'Logstash is heavy — Fluent Bit is preferred for edge/agent-side log collection',
        'Loki is cheaper for high-volume logs (no full-text indexing) but limited query capabilities',
        'Hot/warm/cold tiering: recent logs in fast storage (SSD), older in object storage (S3/GCS)'
      ]},
      { id:'olo4', label:'Log Correlation & Aggregation — correlation IDs across services', what:'Correlation IDs (trace IDs) propagate across service boundaries to stitch together logs from a single request. Each service logs the same trace_id.', why:'Without correlation IDs, debugging a multi-service request requires manual log spelunking across disparate sources — it\'s the #1 productivity booster.', points:[
        'Generate correlation ID at ingress (API gateway or load balancer)',
        'Propagate via HTTP headers: x-request-id, x-correlation-id, or traceparent (W3C)',
        'Each service extracts the ID and includes it in all log statements',
        'AsyncLocalStorage (Node.js) scopes correlation ID per request across async boundaries',
        'Aggregation: query "trace_id=abc123" across all services → single timeline view',
        'Tools: Elastic APM, Grafana Tempo, Datadog trace-log correlation'
      ]},
      { id:'olo5', label:'Log Sampling, Retention & Volume Management', what:'Log volume grows with traffic. Retention policies define how long logs live. Sampling reduces volume while preserving signal.', why:'Raw log volume grows linearly with traffic — without sampling and retention, storage costs explode beyond value.', points:[
        'Dynamic sampling: increase sampling rate during errors, decrease during normal operation',
        'Error sampling: ALWAYS capture 100% of errors — sample only successful requests (1:10, 1:100)',
        'Retention: hot (7 days, fast), warm (30 days, moderate), cold (1 year, cheap object store)',
        'Log rotation: size-based (e.g., 100MB per file) or time-based (e.g., daily) with compression',
        'Log lifecycle: stream → parse → enrich → index → store hot → tier warm → archive cold → delete',
        'Rule of thumb: ~1-2 GB per million requests for structured JSON logs'
      ]},
    ]
  },

function getAnswer(id,phaseIdx) {
  const p=PHASES[phaseIdx];
  if(!p) return null;
  return p.items.find(i=>i.id===id)||null;
}
function loadState() {
  try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));return d||{checked:{},phase:0};}
  catch{return{checked:{},phase:0};}
}
function save() { localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
function loadStreak() {
  try{
    const d=JSON.parse(localStorage.getItem(STREAK_KEY));
    if(!d) return {count:0,last:null};
    const today=new Date().toDateString();
    if(d.last===today) return d;
    const yest=new Date(Date.now()-864e5).toDateString();
    return d.last===yest?{count:d.count+1,last:today}:{count:1,last:today};
  }catch{return{count:0,last:null};}
}
function saveStreak() { localStorage.setItem(STREAK_KEY,JSON.stringify(streak)); }
function loadGoals() {
  try{const d=JSON.parse(localStorage.getItem(GOALS_KEY));return Array.isArray(d)?d:[];}
  catch{return[];}
}
function saveGoals() { localStorage.setItem(GOALS_KEY,JSON.stringify(goals)); }

let state=loadState();
let streak=loadStreak();
let goals=loadGoals();
let activePhase=state.phase;

function totalItems() { return PHASES.reduce((s,p)=>s+p.items.length,0); }
function completedItems() {
  return PHASES.reduce((s,p)=>s+p.items.filter(i=>state.checked[i.id]).length,0);
}
function updateProgress() {
  const t=totalItems(),c=completedItems();
  const pct=t?Math.round(c/t*100):0;
  document.getElementById('overall-pct').textContent=pct+'%';
  document.getElementById('main-bar').style.width=pct+'%';
  document.getElementById('progress-label').textContent=c+' of '+t+' items completed';
  document.getElementById('topic-count').textContent=t;
}

function nextTodoIndex(phaseIdx) {
  const p=PHASES[phaseIdx];
  if(!p) return -1;
  return p.items.findIndex(i=>!state.checked[i.id]);
}

    const allDone=p.items.every(it=>state.checked[it.id]);

    const doneClass=allDone?' done':'';
    return `<div class="phase-tab${active}${doneClass}" onclick="goPhase(${i})">${p.emoji} ${p.title}</div>`;
  }).join('');

  const p=PHASES[activePhase];
  if(!p) return;
  const cont=document.getElementById('content');
  const nd=nextTodoIndex(activePhase);
  const phaseDone=p.items.every(it=>state.checked[it.id]);
  const secs=[];
  const pendingSecs=[];
  p.items.forEach(it=>{
    const done=state.checked[it.id];
    const wrapper=done?secs:pendingSecs;
    wrapper.push(
      `<div class="check-item${done?' checked':''}" data-id="${it.id}">
        <input type="checkbox" id="ni_${it.id}"${done?' checked':''} onchange="toggle('${it.id}',${activePhase})">
        <label for="ni_${it.id}">${it.label}</label>
        <button class="info-btn" onclick="event.stopPropagation();openSidebar('${it.id}',${activePhase})">i</button>
      </div>`
    );
  });
  const allItems=[...pendingSecs,...secs];
  const pb=p.items.length?Math.round(p.items.filter(it=>state.checked[it.id]).length/p.items.length*100):0;

  let html=`<div class="chapter-head">
    <div><div class="chapter-num">PHASE ${activePhase+1} OF ${PHASES.length}</div><div class="chapter-title">${p.emoji} ${p.title}</div></div>
    <div class="chapter-meta"><div class="chapter-week">${p.week}</div><div class="chapter-time">${p.time}</div></div>
  </div>
  <div class="phase-progress-bar"><div class="phase-progress-fill" style="width:${pb}%"></div></div>`;
  html+=allItems.join('\n');

  if(nd>=0){
    html+=`<div class="move-on-box"><div class="move-on-label">⏩ Next topic to study</div><div class="move-on-text">${p.items[nd].label}</div></div>`;
  }else{
    html+=`<div class="move-on-box"><div class="move-on-label">🎉 Phase complete!</div><div class="move-on-text">All topics in this phase are done. Move to the next phase.</div></div>`;
  }
  if(phaseDone){
    html+=`<div class="complete-banner" style="display:block">🎯 Phase ${activePhase+1} completed! You've mastered ${p.title}.</div>`;
  }

  const stuck=PHASES.filter((p,i)=>i<activePhase&&p.items.some(it=>!state.checked[it.id]));
  if(stuck.length){
    html+=`<div class="stuck-box"><div class="stuck-label">⚠️ Review needed</div><div class="stuck-text">You have unfinished topics in Phase ${stuck[0].id+1} (${stuck[0].title}). Consider revisiting before moving further.</div></div>`;
  }

  cont.innerHTML=html;
  document.getElementById('phase-display').textContent='P'+(activePhase+1);
  document.getElementById('today-focus').textContent=nd>=0?'Phase '+(activePhase+1)+' — '+p.items[nd].label:'All phases completed! 🎉';
  updateProgress();
}

function goPhase(i) {
  if(i>=0&&i<PHASES.length){activePhase=i;state.phase=i;save();render();}
}

function toggle(id,phaseIdx) {
  state.checked[id]=!state.checked[id];
  save();
  render();
  if(state.checked[id]){
    const s=streak;const today=new Date().toDateString();
    if(s.last!==today){s.count++;s.last=today;saveStreak();}
  }
  updateStreakUI();
}

function toggleFromSidebar(id) {
  state.checked[id]=!state.checked[id];
  save();
  closeSidebar();
  render();
  if(state.checked[id]){
    const s=streak;const today=new Date().toDateString();
    if(s.last!==today){s.count++;s.last=today;saveStreak();}
  }
  updateStreakUI();
}

function openSidebar(id,phaseIdx) {
  const p=PHASES[phaseIdx];if(!p)return;
  const item=p.items.find(i=>i.id===id);if(!item)return;
  document.getElementById('sb-icon').textContent=p.icon||p.emoji;
  document.getElementById('sb-title').textContent=item.label;
  document.getElementById('sb-phase').textContent='Phase '+(phaseIdx+1)+': '+p.title;
  const done=!!state.checked[id];
  const btn=document.getElementById('sb-done-btn');
  btn.textContent=done?'Completed ✓':'Mark as completed →';
  btn.className='mark-done-btn'+(done?' already-done':'');
  btn.setAttribute('onclick',`toggleFromSidebar('${id}')`);
  const body=document.getElementById('sb-body');
  body.innerHTML=`
    <div class="info-block"><div class="info-block-label"><span>📖</span> What is this?</div><div class="info-block-text">${item.what||'Deep dive topic.'}</div></div>
    <div class="info-block"><div class="info-block-label"><span>💡</span> Why it matters</div><div class="info-block-text">${item.why||'Essential for architect-level understanding.'}</div></div>
    <div class="info-block"><div class="info-block-label"><span>🎯</span> Key points</div><div class="key-points">${(item.points||['Study this topic']).map(pt=>'<div class="key-point"><span class="key-point-dot"></span>'+pt+'</div>').join('')}</div></div>
  `;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sidebar').classList.add('open');
}
function closeSidebar() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sidebar').classList.remove('open');
}

function updateStreakUI() {
  const s=streak;
  document.getElementById('streak-text').textContent=s.count+' day streak'+(s.count>0?' 🔥 — keep going!':' — start today');
}
function renderGoals() {
  const list=document.getElementById('goal-list');
  list.innerHTML=goals.map((g,i)=>`
    <div class="goal-item" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:10px;margin-bottom:6px;">
      <span style="font-size:14px;font-weight:500;color:var(--accent-black)">${g}</span>
      <span onclick="removeGoal(${i})" style="cursor:pointer;opacity:.5;font-size:14px;font-weight:600">✕</span>
    </div>`).join('');
}
function addGoal() {
  const inp=document.getElementById('goal-input');
  const v=inp.value.trim();
  if(!v)return;
  goals.push(v);saveGoals();renderGoals();inp.value='';
}
function removeGoal(i) {
  goals.splice(i,1);saveGoals();renderGoals();
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){const i=(activePhase-1+PHASES.length)%PHASES.length;goPhase(i);}
  if(e.key==='ArrowRight'){const i=(activePhase+1)%PHASES.length;goPhase(i);}
});

// INIT
(function(){
  render();
  document.getElementById('quote-block').innerHTML=QUOTES.map(q=>`<div>${q[0]}<cite>${q[1]}</cite></div>`).join('<br>');
  updateStreakUI();
  renderGoals();
})();
</script>

.goal-add-row { display: flex; gap: 8px; align-items: center; }
.goal-input { flex: 1; padding: 8px 12px; border: 1px solid rgba(0,0,0,.1); border-radius: 10px; font-size: 13px; font-family: inherit; outline: none; background: rgba(0,0,0,.02); }
.goal-input:focus { border-color: var(--accent-black); background: #fff; }
.btn-add-goal { padding: 8px 14px; border: none; border-radius: 10px; background: var(--accent-black); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-add-goal:hover { opacity: .85; }
.goal-list { margin-top: 8px; max-height: 200px; overflow-y: auto; }
